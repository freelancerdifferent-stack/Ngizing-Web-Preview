<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fire Arrow 3D VFX</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080301;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#fff2df;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ffe4bd;background:#1b0b04dd;border:1px solid #8b3b13;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.fire{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #ffd079;color:white;font-weight:bold;font-size:22px;background:radial-gradient(circle,#ffb21d,#b63205 62%,#2a0800);box-shadow:0 0 25px #ff7b00,0 0 60px #ff2600,inset 0 0 24px #ffd65a}#flash{position:fixed;inset:0;z-index:15;background:#ffbd58;opacity:0;pointer-events:none;transition:opacity .2s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Geser = putar · Cubit = zoom · Fire Arrow 40 unit</div><div id="flash"></div><button class="fire" id="fire">FIRE</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x080301);scene.fog=new THREE.FogExp2(0x160904,.014);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,140);camera.position.set(0,7,28);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.5,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=8;controls.maxDistance=55;controls.maxPolarAngle=Math.PI*.49;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.5,.45,.15);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x4b2818,0x080301,.65));const sun=new THREE.DirectionalLight(0xffd5a0,1.3);sun.position.set(-10,15,8);scene.add(sun);const groundMat=new THREE.MeshStandardMaterial({color:0x27170f,roughness:.96});const gg=new THREE.PlaneGeometry(80,50,55,35),p=gg.attributes.position;for(let i=0;i<p.count;i++)p.setZ(i,(Math.sin(p.getX(i)*1.4)+Math.cos(p.getY(i)*1.7))*.08+Math.random()*.08);gg.computeVertexNormals();const ground=new THREE.Mesh(gg,groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(70,70,0xff7b26,0x4a2414);grid.position.y=.1;grid.material.transparent=true;grid.material.opacity=.24;scene.add(grid);for(let i=0;i<70;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.15+Math.random()*.65,0),groundMat),x=-32+Math.random()*64,z=(Math.random()-.5)*26;m.position.set(x,.2,z);m.scale.y=.5+Math.random()*1.3;m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);scene.add(m)}const START_X=-20,END_X=20,FLIGHT=1700;const target=new THREE.Group();const tm=new THREE.MeshStandardMaterial({color:0x3a241c,roughness:.8});const post=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,3.5,10),tm);post.position.y=1.75;target.add(post);const plate=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,.18,32),new THREE.MeshStandardMaterial({color:0x42190c,roughness:.75}));plate.rotation.x=Math.PI/2;plate.position.y=3;target.add(plate);target.position.set(END_X,0,0);scene.add(target);const fx=new THREE.Group();scene.add(fx);const glowMat=(c,o=1)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false});const arrow=new THREE.Group();const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,2.3,8),new THREE.MeshStandardMaterial({color:0x3b1d0b,roughness:.65}));shaft.rotation.z=Math.PI/2;arrow.add(shaft);const head=new THREE.Mesh(new THREE.ConeGeometry(.18,.55,8),new THREE.MeshStandardMaterial({color:0x787878,metalness:.7,roughness:.25,emissive:0xff3c00,emissiveIntensity:.7}));head.rotation.z=-Math.PI/2;head.position.x=1.4;arrow.add(head);for(const z of[-.14,.14]){const f=new THREE.Mesh(new THREE.ConeGeometry(.16,.5,4),new THREE.MeshStandardMaterial({color:0x4d0e05,roughness:.8}));f.rotation.z=Math.PI/2;f.position.set(-1.1,0,z);f.scale.y=.35;arrow.add(f)}arrow.position.set(START_X,1.8,0);scene.add(arrow);const fireLight=new THREE.PointLight(0xff5a0a,0,10,2);scene.add(fireLight);let particles=[],rings=[],active=false,start=0,AC=null;function particle(pos,vel,size=.12,life=700,color=0xff6a00){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(size,0),glowMat(color,.9));m.position.copy(pos);m.userData={vel,life,born:performance.now()};fx.add(m);particles.push(m);return m}function ring(pos){const r=new THREE.Mesh(new THREE.TorusGeometry(.4,.055,8,42),glowMat(0xff9b21,.9));r.rotation.y=Math.PI/2;r.position.copy(pos);r.userData.born=performance.now();fx.add(r);rings.push(r)}function clean(){for(const x of [...particles,...rings])fx.remove(x);particles=[];rings=[]}async function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();const t=AC.currentTime,master=AC.createGain(),comp=AC.createDynamicsCompressor();master.gain.value=.8;master.connect(comp).connect(AC.destination);function n(st,dur,gain,f1,f2){const sr=AC.sampleRate,b=AC.createBuffer(1,sr*dur|0,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.Q.value=.6;f.frequency.setValueAtTime(f1,t+st);f.frequency.exponentialRampToValueAtTime(f2,t+st+dur);g.gain.setValueAtTime(gain,t+st);g.gain.exponentialRampToValueAtTime(.001,t+st+dur);s.connect(f).connect(g).connect(master);s.start(t+st)}function o(type,f1,f2,g,st,dur){const x=AC.createOscillator(),a=AC.createGain();x.type=type;x.frequency.setValueAtTime(f1,t+st);x.frequency.exponentialRampToValueAtTime(f2,t+st+dur);a.gain.setValueAtTime(g,t+st);a.gain.exponentialRampToValueAtTime(.001,t+st+dur);x.connect(a).connect(master);x.start(t+st);x.stop(t+st+dur)}n(0,1.55,.28,500,2200);o('sawtooth',170,520,.08,0,1.5);n(1.48,.38,.85,6500,350);o('sine',110,34,.7,1.49,.8);n(1.58,1.15,.25,1300,120)}function cast(){if(active)return;clean();active=true;start=performance.now();arrow.visible=true;arrow.position.set(START_X,1.8,0);arrow.rotation.z=0}function explode(){const pos=new THREE.Vector3(END_X-.3,2.25,0);ring(pos);ring(pos);for(let i=0;i<85;i++){const a=Math.random()*Math.PI*2,b=(Math.random()-.5)*Math.PI,sp=2+Math.random()*8;particle(pos,new THREE.Vector3(Math.cos(a)*Math.cos(b)*sp,Math.sin(b)*sp,Math.sin(a)*Math.cos(b)*sp),.05+Math.random()*.16,700+Math.random()*850,Math.random()>.35?0xff6a00:0xffd25a)}fireLight.position.copy(pos);fireLight.intensity=45;document.querySelector('#flash').style.opacity='.45';setTimeout(()=>document.querySelector('#flash').style.opacity='0',70)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const u=Math.min(1,(now-start)/FLIGHT);const x=START_X+40*u,y=1.8+Math.sin(u*Math.PI)*2.8;arrow.position.set(x,y,0);arrow.rotation.z=-Math.atan2(2.8*Math.PI*Math.cos(u*Math.PI),40);fireLight.position.copy(arrow.position);fireLight.intensity=8+Math.random()*5;for(let i=0;i<5;i++)particle(arrow.position.clone().add(new THREE.Vector3(-.8+Math.random()*.5,(Math.random()-.5)*.3,(Math.random()-.5)*.3)),new THREE.Vector3(-1.5-Math.random()*2,.3+Math.random(),(Math.random()-.5)),.04+Math.random()*.12,350+Math.random()*300,Math.random()>.25?0xff5a00:0xffd45a);if(u>=1){active=false;arrow.visible=false;explode()}}particles=particles.filter(m=>{const age=now-m.userData.born;if(age>m.userData.life){fx.remove(m);return false}const dt=.016;m.position.addScaledVector(m.userData.vel,dt);m.userData.vel.y-=2.5*dt;m.scale.setScalar(Math.max(.05,1-age/m.userData.life));m.material.opacity=Math.max(0,1-age/m.userData.life);return true});rings=rings.filter((r,i)=>{const age=now-r.userData.born;if(age>700){fx.remove(r);return false}r.scale.setScalar(1+age/90+(i%2)*.5);r.material.opacity=1-age/700;return true});fireLight.intensity*=.94;composer.render()}requestAnimationFrame(loop);document.querySelector('#fire').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await audio()}catch(err){console.error(err)}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
