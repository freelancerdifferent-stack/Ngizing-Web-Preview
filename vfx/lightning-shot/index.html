<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Q Horizontal</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#effcff;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ccefff;background:#06111ccc;border:1px solid #23506b;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.q{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #8ef5ff;color:white;font-size:26px;background:radial-gradient(circle,#1788bc,#063452 65%,#02101b);box-shadow:0 0 24px #31ddff,0 0 55px #0875ff,inset 0 0 25px #50eaff}#flash{position:fixed;inset:0;z-index:15;background:#eaffff;opacity:0;pointer-events:none;transition:opacity .25s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Lightning Q · versi horizontal · 40 unit</div><div id="flash"></div><button class="q" id="q">Q</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);scene.fog=new THREE.FogExp2(0x07111b,.014);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,140);camera.position.set(0,7,28);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.5,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=8;controls.maxDistance=55;controls.maxPolarAngle=Math.PI*.48;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.65,.55,.12);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x284866,0x050404,.55));const moon=new THREE.DirectionalLight(0x6b8ca8,1.2);moon.position.set(-7,10,5);scene.add(moon);const mat=new THREE.MeshStandardMaterial({color:0x20272c,roughness:.93});const gg=new THREE.PlaneGeometry(80,45,55,35),pa=gg.attributes.position;for(let i=0;i<pa.count;i++){let X=pa.getX(i),Y=pa.getY(i);pa.setZ(i,(Math.sin(X*1.7)+Math.cos(Y*1.35)+Math.sin((X+Y)*2.1))*.1+Math.random()*.12)}gg.computeVertexNormals();const ground=new THREE.Mesh(gg,mat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(70,70,0x37c9ff,0x17435a);grid.position.y=.12;grid.material.transparent=true;grid.material.opacity=.42;scene.add(grid);for(let i=0;i<70;i++){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(.2+Math.random()*.8,1),mat);m.position.set(-32+Math.random()*64,.2,(Math.random()-.5)*24);m.scale.y=.7+Math.random()*1.8;m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);scene.add(m)}const S=new THREE.Vector3(-20,3,0),E=new THREE.Vector3(20,3,0);const target=new THREE.Group(),tm=new THREE.MeshStandardMaterial({color:0x28343d,roughness:.85});const post=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,4,10),tm);post.position.y=2;target.add(post);const plate=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,.2,32),tm);plate.rotation.x=Math.PI/2;plate.position.y=3;target.add(plate);target.position.x=20;scene.add(target);const impact=new THREE.PointLight(0x4adfff,0,28,1.5);impact.position.copy(E);scene.add(impact);const sourceLight=new THREE.PointLight(0x4adfff,0,20,1.5);sourceLight.position.copy(S);scene.add(sourceLight);const fx=new THREE.Group();scene.add(fx);function gm(c,o){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function bolt(s,e,n=24,j=.3,r=.045){let p=[s.clone()];for(let i=1;i<n;i++){let t=i/n,q=s.clone().lerp(e,t);q.x+=(Math.random()-.5)*j*.5;q.z+=(Math.random()-.5)*j;q.y+=(Math.random()-.5)*j;p.push(q)}p.push(e.clone());let c=new THREE.CatmullRomCurve3(p),G=new THREE.Group();G.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r*4,5),gm(0x147cff,.17)));G.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r,6),gm(0xd9ffff,1)));return G}let AC=null;async function unlockAudio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume()}function sound(){if(!AC||AC.state!=='running')return;const t=AC.currentTime,master=AC.createGain(),comp=AC.createDynamicsCompressor();master.gain.value=.9;comp.threshold.value=-16;comp.ratio.value=6;master.connect(comp).connect(AC.destination);function osc(type,f1,f2,gain,start,dur){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t+start);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+start+dur);g.gain.setValueAtTime(gain,t+start);g.gain.exponentialRampToValueAtTime(.001,t+start+dur);o.connect(g).connect(master);o.start(t+start);o.stop(t+start+dur)}function noise(start,dur,gain,hi,lo){const sr=AC.sampleRate,n=Math.floor(sr*dur),b=AC.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.Q.value=.7;f.frequency.setValueAtTime(hi,t+start);f.frequency.exponentialRampToValueAtTime(lo,t+start+dur);g.gain.setValueAtTime(gain,t+start);g.gain.exponentialRampToValueAtTime(.001,t+start+dur);s.connect(f).connect(g).connect(master);s.start(t+start)}noise(0,.22,.34,6500,2800);osc('sawtooth',420,1700,.12,0,.24);for(let i=0;i<11;i++){let s=.03+i*.045+Math.random()*.025;osc(i%2?'square':'sawtooth',1800+Math.random()*3000,350+Math.random()*800,.1,s,.04);noise(s,.05,.14,8000,1800)}noise(.28,.18,.72,9000,1200);osc('square',4600,160,.3,.29,.09);osc('sine',120,29,1.05,.3,1.35);noise(.4,1.7,.45,2600,180)}let active=false,st=0,bolts=[],rings=[],debris=[];function clean(){for(const o of[...bolts,...rings,...debris])fx.remove(o);bolts=[];rings=[];debris=[]}function cast(){if(active)return;clean();active=true;st=performance.now();let main=bolt(S,E,72,1.05,.1);fx.add(main);bolts.push(main);for(let i=0;i<32;i++){let x=-19+Math.random()*38,a=S.clone().lerp(E,(x+20)/40),L=2+Math.random()*6,ang=Math.random()*Math.PI*2,e=new THREE.Vector3(x+(Math.random()-.5)*3,3+Math.cos(ang)*L,Math.sin(ang)*L),b=bolt(a,e,12,.4,.025);fx.add(b);bolts.push(b)}for(let i=0;i<4;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(.6,.045,8,70),gm(0x68eaff,.8));r.rotation.y=Math.PI/2;r.position.copy(E);fx.add(r);rings.push(r)}for(let i=0;i<70;i++){let d=new THREE.Mesh(new THREE.TetrahedronGeometry(.05+Math.random()*.15),mat);d.position.copy(E);d.userData.v=new THREE.Vector3((Math.random()-.5)*8,(Math.random()-.5)*8,(Math.random()-.5)*8);fx.add(d);debris.push(d)}let F=document.querySelector('#flash');F.style.opacity='.9';setTimeout(()=>F.style.opacity='0',70)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){let ms=now-st,t=ms/2300,f=Math.max(0,1-t);impact.intensity=70*Math.max(0,1-ms/1100);sourceLight.intensity=35*Math.max(0,1-ms/900);bolts.forEach(b=>b.visible=Math.random()>.06);rings.forEach((r,i)=>{r.scale.setScalar(.5+Math.min(1,ms/950)*(5+i*1.6));r.material.opacity=f});let dt=Math.min(ms,1500)/1000;debris.forEach(d=>{d.position.copy(E).addScaledVector(d.userData.v,dt);d.position.y-=4.5*dt*dt});bloom.strength=1.7+Math.max(0,1-ms/850)*2.6;if(t>=1){active=false;impact.intensity=0;sourceLight.intensity=0;clean()}}composer.render()}requestAnimationFrame(loop);document.querySelector('#q').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await unlockAudio();sound()}catch(err){console.error(err)}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
