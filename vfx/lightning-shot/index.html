<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Stream 3D VFX</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#effcff;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ccefff;background:#06111cdd;border:1px solid #23506b;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.shot{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #a8f9ff;color:white;font-weight:bold;font-size:17px;background:radial-gradient(circle,#29cfff,#075a9b 60%,#02162a);box-shadow:0 0 26px #40eaff,0 0 65px #086dff,inset 0 0 26px #c8ffff}#flash{position:fixed;inset:0;z-index:15;background:#eaffff;opacity:0;pointer-events:none;transition:opacity .12s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Geser = putar · Cubit = zoom · Sambaran petir mengalir 40 unit</div><div id="flash"></div><button id="shot" class="shot">STRIKE</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);scene.fog=new THREE.FogExp2(0x07111b,.013);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,150);camera.position.set(0,7,28);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.78;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=8;controls.maxDistance=60;controls.maxPolarAngle=Math.PI*.49;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2,.55,.08);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x274969,0x030508,.6));const gm=new THREE.MeshStandardMaterial({color:0x172027,roughness:.95});const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,45,20,20),gm);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(70,70,0x37c9ff,0x143b59);grid.position.y=.08;grid.material.transparent=true;grid.material.opacity=.3;scene.add(grid);for(let i=0;i<60;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.15+Math.random()*.6,0),gm);m.position.set(-32+Math.random()*64,.2,(Math.random()-.5)*25);m.scale.y=.5+Math.random()*1.5;m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);scene.add(m)}const START=-20,END=20,Y=2.5;const target=new THREE.Group(),tm=new THREE.MeshStandardMaterial({color:0x26313b,roughness:.8});const post=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,3.8,10),tm);post.position.y=1.9;target.add(post);const plate=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.2,32),tm);plate.rotation.x=Math.PI/2;plate.position.y=2.8;target.add(plate);target.position.x=END;scene.add(target);const source=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),new THREE.MeshBasicMaterial({color:0xdfffff}));source.position.set(START,Y,0);scene.add(source);const fx=new THREE.Group();scene.add(fx);const add=(c,o=1)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false});function bolt(a,b,n=70,j=.55,r=.035,phase=0){let p=[a.clone()];for(let i=1;i<n;i++){const t=i/n,q=a.clone().lerp(b,t),wave=Math.sin(t*55+phase)*.13;q.y+=wave+(Math.random()-.5)*j;q.z+=Math.cos(t*47+phase)*.1+(Math.random()-.5)*j;p.push(q)}p.push(b.clone());const c=new THREE.CatmullRomCurve3(p),g=new THREE.Group();g.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r*5,5),add(0x126cff,.16)));g.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r*2,5),add(0x39cfff,.38)));g.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r,6),add(0xf0ffff,1)));return g}let bolts=[],sparks=[],rings=[],active=false,st=0,AC=null;const lights=[];for(let i=0;i<5;i++){const l=new THREE.PointLight(0x42dfff,0,13,2);scene.add(l);lights.push(l)}function clearBolts(){for(const b of bolts)fx.remove(b);bolts=[]}function clean(){clearBolts();for(const x of[...sparks,...rings])fx.remove(x);sparks=[];rings=[]}function spark(pos,spread=3){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.035+Math.random()*.07),add(Math.random()>.3?0xdfffff:0x258cff,.9));m.position.copy(pos);m.userData={v:new THREE.Vector3((Math.random()-.5)*spread,(Math.random()-.5)*spread,(Math.random()-.5)*spread),born:performance.now(),life:180+Math.random()*300};fx.add(m);sparks.push(m)}function rebuildStream(now,power){clearBolts();const A=new THREE.Vector3(START,Y,0),B=new THREE.Vector3(END,Y,0);for(let k=0;k<3;k++){const b=bolt(A,B,75,.42+k*.12,.026+k*.006,now*.018+k*2.1);fx.add(b);bolts.push(b)}for(let i=0;i<14;i++){const x=START+2+Math.random()*36,len=1+Math.random()*3.8,dir=Math.random()>.5?1:-1,a=new THREE.Vector3(x,Y+(Math.random()-.5)*.25,(Math.random()-.5)*.2),b=new THREE.Vector3(Math.min(END,Math.max(START,x+dir*len)),Y+(Math.random()-.5)*2.4,(Math.random()-.5)*2.4),br=bolt(a,b,9,.28,.012,now*.02+i);fx.add(br);bolts.push(br)}bolts.forEach(b=>b.visible=Math.random()>.025);for(let i=0;i<lights.length;i++){const x=START+(i+.5)*(40/lights.length);lights[i].position.set(x,Y,0);lights[i].intensity=(8+Math.random()*8)*power}}async function sound(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();const t=AC.currentTime,m=AC.createGain(),c=AC.createDynamicsCompressor();m.gain.value=.9;c.threshold.value=-15;c.ratio.value=6;m.connect(c).connect(AC.destination);function n(s,d,g,f1,f2){const sr=AC.sampleRate,b=AC.createBuffer(1,sr*d|0,sr),z=b.getChannelData(0);for(let i=0;i<z.length;i++)z[i]=Math.random()*2-1;const q=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();q.buffer=b;f.type='bandpass';f.Q.value=.75;f.frequency.setValueAtTime(f1,t+s);f.frequency.exponentialRampToValueAtTime(f2,t+s+d);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+d);q.connect(f).connect(a).connect(m);q.start(t+s)}function o(type,f1,f2,g,s,d){const x=AC.createOscillator(),a=AC.createGain();x.type=type;x.frequency.setValueAtTime(f1,t+s);x.frequency.exponentialRampToValueAtTime(f2,t+s+d);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+d);x.connect(a).connect(m);x.start(t+s);x.stop(t+s+d)}n(0,1.35,.48,7200,1600);o('sawtooth',650,1800,.11,0,1.25);for(let i=0;i<16;i++)n(.03+i*.07,.055,.2,9000,2100);n(1.05,.5,.72,8000,300);o('sine',95,28,.7,1.08,.8)}function impact(){const p=new THREE.Vector3(END,Y,0);for(let i=0;i<90;i++)spark(p,9);for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.45,.045,8,50),add(0x9ffaff,.9));r.rotation.y=Math.PI/2;r.position.copy(p);r.userData.born=performance.now();fx.add(r);rings.push(r)}const F=document.querySelector('#flash');F.style.opacity='.65';setTimeout(()=>F.style.opacity='0',60)}function cast(){if(active)return;clean();active=true;st=performance.now();const F=document.querySelector('#flash');F.style.opacity='.25';setTimeout(()=>F.style.opacity='0',40)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const age=now-st,power=Math.min(1,age/100)*Math.max(0,1-(age-1050)/300);rebuildStream(now,Math.max(.15,power));for(let i=0;i<8;i++){const x=START+Math.random()*40;spark(new THREE.Vector3(x,Y+(Math.random()-.5)*.45,(Math.random()-.5)*.45),2.5)}if(age>1250){active=false;clearBolts();lights.forEach(l=>l.intensity=0);impact()}}sparks=sparks.filter(s=>{const a=now-s.userData.born;if(a>s.userData.life){fx.remove(s);return false}s.position.addScaledVector(s.userData.v,.016);s.material.opacity=1-a/s.userData.life;return true});rings=rings.filter((r,i)=>{const a=now-r.userData.born;if(a>700){fx.remove(r);return false}r.scale.setScalar(1+a/90+i*.35);r.material.opacity=1-a/700;return true});composer.render()}requestAnimationFrame(loop);document.querySelector('#shot').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await sound()}catch(err){console.error(err)}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
