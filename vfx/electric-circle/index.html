<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Electric Circle VFX</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#effcff;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ccefff;background:#06111cdd;border:1px solid #23506b;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.cast{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #a8f9ff;color:white;font-weight:bold;font-size:15px;background:radial-gradient(circle,#25bfe9,#07558b 62%,#02152a);box-shadow:0 0 26px #40eaff,0 0 65px #086dff,inset 0 0 26px #c8ffff}#flash{position:fixed;inset:0;z-index:15;background:#eaffff;opacity:0;pointer-events:none;transition:opacity .16s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Electric Circle · menjalar membesar · radius 20 unit</div><div id="flash"></div><button class="cast" id="cast">CAST</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x01040a);scene.fog=new THREE.FogExp2(0x06111c,.012);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,120);camera.position.set(0,18,25);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=9;controls.maxDistance=55;controls.maxPolarAngle=Math.PI*.48;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2.1,.55,.08);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x274969,0x020305,.65));const groundMat=new THREE.MeshStandardMaterial({color:0x111a22,roughness:.96});const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60,30,30),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(55,55,0x2fcfff,0x123f60);grid.position.y=.07;grid.material.transparent=true;grid.material.opacity=.32;scene.add(grid);for(let i=0;i<80;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.5,0),groundMat);m.position.set((Math.random()-.5)*45,.12,(Math.random()-.5)*45);m.scale.y=.5+Math.random();m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);scene.add(m)}const fx=new THREE.Group();scene.add(fx);const coreLight=new THREE.PointLight(0x4be7ff,0,30,1.5);coreLight.position.set(0,1,0);scene.add(coreLight);function mat(c,o=1){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function electricRing(radius,segments=100,jitter=.42){const pts=[];for(let i=0;i<=segments;i++){const a=i/segments*Math.PI*2,r=radius+(Math.random()-.5)*jitter;pts.push(new THREE.Vector3(Math.cos(a)*r,.16+Math.random()*.1,Math.sin(a)*r))}const curve=new THREE.CatmullRomCurve3(pts,true),g=new THREE.Group();g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,segments*2,.13,5,true),mat(0x147cff,.18)));g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,segments*2,.035,5,true),mat(0xeaffff,1)));return g}function arc(a,b,n=10,j=.4){const p=[a.clone()];for(let i=1;i<n;i++){const t=i/n,q=a.clone().lerp(b,t);q.x+=(Math.random()-.5)*j;q.y+=(Math.random()-.5)*j*.35;q.z+=(Math.random()-.5)*j;p.push(q)}p.push(b.clone());const c=new THREE.CatmullRomCurve3(p),g=new THREE.Group();g.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,.08,4),mat(0x147cff,.18)));g.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,.025,5),mat(0xeaffff,.95)));return g}let rings=[],arcs=[],sparks=[],active=false,start=0,AC=null;function clearFx(){for(const o of[...rings,...arcs,...sparks])fx.remove(o);rings=[];arcs=[];sparks=[]}function spark(p){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.035+Math.random()*.08),mat(Math.random()>.25?0xeaffff:0x278cff,.95));m.position.copy(p);m.userData={born:performance.now(),life:250+Math.random()*450,v:new THREE.Vector3((Math.random()-.5)*4,.5+Math.random()*3,(Math.random()-.5)*4)};fx.add(m);sparks.push(m)}async function sound(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();const t=AC.currentTime,m=AC.createGain();m.gain.value=.75;m.connect(AC.destination);function noise(s,d,g,f1,f2){const sr=AC.sampleRate,b=AC.createBuffer(1,sr*d|0,sr),z=b.getChannelData(0);for(let i=0;i<z.length;i++)z[i]=Math.random()*2-1;const q=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();q.buffer=b;f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(f1,t+s);f.frequency.exponentialRampToValueAtTime(f2,t+s+d);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+d);q.connect(f).connect(a).connect(m);q.start(t+s)}function osc(f1,f2,g,s,d){const o=AC.createOscillator(),a=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f1,t+s);o.frequency.exponentialRampToValueAtTime(f2,t+s+d);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+d);o.connect(a).connect(m);o.start(t+s);o.stop(t+s+d)}noise(0,1.8,.4,6500,800);osc(180,950,.08,0,1.4);for(let i=0;i<16;i++)noise(i*.09,.055,.16,9000,1800);noise(1.25,.45,.65,7000,250)}function cast(){if(active)return;clearFx();active=true;start=performance.now();const F=document.querySelector('#flash');F.style.opacity='.55';setTimeout(()=>F.style.opacity='0',55)}function rebuild(now,progress){for(const o of[...rings,...arcs])fx.remove(o);rings=[];arcs=[];const radii=[Math.max(.4,progress*20),Math.max(.3,progress*20-3.4),Math.max(.2,progress*20-6.8)];for(let k=0;k<3;k++){if(radii[k]<=.3)continue;const r=electricRing(radii[k],90,.35+k*.12);fx.add(r);rings.push(r);for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,rr=radii[k],p1=new THREE.Vector3(Math.cos(a)*rr,.2,Math.sin(a)*rr),len=.7+Math.random()*2.8,dir=Math.random()>.5?1:-1,p2=new THREE.Vector3(Math.cos(a+dir*.13)*Math.max(.2,rr+len*(Math.random()-.3)),.15+Math.random()*.55,Math.sin(a+dir*.13)*Math.max(.2,rr+len*(Math.random()-.3)));const b=arc(p1,p2,7,.45);fx.add(b);arcs.push(b)}}for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2,r=progress*20,p=new THREE.Vector3(Math.cos(a)*r,.25,Math.sin(a)*r);spark(p)}}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const age=now-start,p=Math.min(1,age/1800);rebuild(now,1-Math.pow(1-p,2.2));coreLight.intensity=(1-p)*45;bloom.strength=2+Math.sin(age*.03)*.45;if(age>1800){active=false;coreLight.intensity=0;for(const o of[...rings,...arcs])fx.remove(o);rings=[];arcs=[]}}sparks=sparks.filter(s=>{const a=now-s.userData.born;if(a>s.userData.life){fx.remove(s);return false}s.position.addScaledVector(s.userData.v,.016);s.userData.v.y-=.04;s.material.opacity=1-a/s.userData.life;return true});composer.render()}requestAnimationFrame(loop);document.querySelector('#cast').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await sound()}catch(err){}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
