<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brutal Meteor Rain Circle</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050207;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#fff0e8;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ffe0c5;background:#1b0906dd;border:1px solid #71351d;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.cast{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #ffd19b;color:white;font-weight:bold;font-size:14px;background:radial-gradient(circle,#ff8a24,#a72808 62%,#2a0602);box-shadow:0 0 26px #ff8a28,0 0 65px #ff3008,inset 0 0 26px #fff0bf}#flash{position:fixed;inset:0;z-index:15;background:#fff0d0;opacity:0;pointer-events:none;transition:opacity .07s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Meteor Rain · BRUTAL · lurus vertikal · radius 20 unit</div><div id="flash"></div><button class="cast" id="cast">METEOR</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x050207);scene.fog=new THREE.FogExp2(0x100606,.009);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,150);camera.position.set(0,22,29);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=60;controls.maxPolarAngle=Math.PI*.48;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2.35,.62,.06);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x55321f,0x080202,.55));const groundMat=new THREE.MeshStandardMaterial({color:0x201511,roughness:.96});const ground=new THREE.Mesh(new THREE.PlaneGeometry(65,65),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(58,58,0xff6b28,0x512112);grid.position.y=.07;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);for(let i=0;i<65;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.5,0),groundMat);m.position.set((Math.random()-.5)*48,.12,(Math.random()-.5)*48);m.scale.y=.5+Math.random();m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);scene.add(m)}const zone=new THREE.Mesh(new THREE.RingGeometry(19.6,20,128),new THREE.MeshBasicMaterial({color:0xff5a18,transparent:true,opacity:.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));zone.rotation.x=-Math.PI/2;zone.position.y=.12;scene.add(zone);const fx=new THREE.Group();scene.add(fx);const rockGeo=new THREE.IcosahedronGeometry(.42,1),sparkGeo=new THREE.TetrahedronGeometry(.08);const rockMat=new THREE.MeshStandardMaterial({color:0x32120a,emissive:0xd52a00,emissiveIntensity:2.3,roughness:.7});const glowMat=new THREE.MeshBasicMaterial({color:0xff4a00,transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false});const trailMat=new THREE.MeshBasicMaterial({color:0xff4a00,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false});const coreMat=new THREE.MeshBasicMaterial({color:0xffffcf,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});let meteors=[],impacts=[],sparks=[],active=false,start=0,nextSpawn=0,AC=null;function point(){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*19;return{x:Math.cos(a)*r,z:Math.sin(a)*r}}function spawn(now){const p=point(),g=new THREE.Group(),size=.65+Math.random()*.65,rock=new THREE.Mesh(rockGeo,rockMat);rock.scale.setScalar(size);const glow=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),glowMat);glow.scale.setScalar(size*1.6);g.add(glow,rock);const len=12+Math.random()*10,trail=new THREE.Mesh(new THREE.CylinderGeometry(.09*size,.5*size,len,7),trailMat);trail.position.y=len*.5+.3;g.add(trail);const core=new THREE.Mesh(new THREE.CylinderGeometry(.035,.13*size,len*.85,6),coreMat);core.position.y=len*.425+.3;g.add(core);g.position.set(p.x,35+Math.random()*16,p.z);g.userData={speed:55+Math.random()*30};fx.add(g);meteors.push(g)}function hit(p,now){const light=new THREE.PointLight(0xff5715,55,15,2);light.position.set(p.x,.7,p.z);scene.add(light);const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.09,8,40),new THREE.MeshBasicMaterial({color:0xffa13b,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.x=Math.PI/2;ring.position.set(p.x,.2,p.z);ring.userData={born:now,light};fx.add(ring);impacts.push(ring);for(let i=0;i<8;i++){const s=new THREE.Mesh(sparkGeo,new THREE.MeshBasicMaterial({color:i%3?0xff9a25:0xffffc0,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));s.position.set(p.x,.25,p.z);s.userData={born:now,life:220+Math.random()*330,v:new THREE.Vector3((Math.random()-.5)*10,2+Math.random()*8,(Math.random()-.5)*10)};fx.add(s);sparks.push(s)}const F=document.querySelector('#flash');F.style.opacity='.13';setTimeout(()=>F.style.opacity='0',24)}async function sound(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();const t=AC.currentTime,m=AC.createGain();m.gain.value=.8;m.connect(AC.destination);function noise(s,d,g,f1,f2){const sr=AC.sampleRate,b=AC.createBuffer(1,sr*d|0,sr),z=b.getChannelData(0);for(let i=0;i<z.length;i++)z[i]=Math.random()*2-1;const q=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();q.buffer=b;f.type='bandpass';f.Q.value=.6;f.frequency.setValueAtTime(f1,t+s);f.frequency.exponentialRampToValueAtTime(f2,t+s+d);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+d);q.connect(f).connect(a).connect(m);q.start(t+s)}noise(0,4,.32,6000,400);for(let i=0;i<28;i++)noise(.12+i*.12,.1,.25+Math.random()*.18,8500,450)}function cast(){if(active)return;active=true;start=performance.now();nextSpawn=start;const F=document.querySelector('#flash');F.style.opacity='.42';setTimeout(()=>F.style.opacity='0',50)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const age=now-start;if(age<3500&&now>=nextSpawn){const count=5+Math.floor(Math.random()*4);for(let i=0;i<count;i++)spawn(now);nextSpawn=now+45+Math.random()*35}if(age>4300)active=false}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.position.y-=m.userData.speed*.016;m.rotation.y+=.09;if(m.position.y<=.45){hit(m.position,now);fx.remove(m);meteors.splice(i,1)}}impacts=impacts.filter(r=>{const a=now-r.userData.born;if(a>500){scene.remove(r.userData.light);fx.remove(r);return false}r.scale.setScalar(1+a/55);r.material.opacity=1-a/500;r.userData.light.intensity=55*(1-a/500);return true});sparks=sparks.filter(s=>{const a=now-s.userData.born;if(a>s.userData.life){fx.remove(s);return false}s.position.addScaledVector(s.userData.v,.016);s.userData.v.y-=.18;s.material.opacity=1-a/s.userData.life;return true});zone.material.opacity=.27+Math.sin(now*.012)*.1;composer.render()}requestAnimationFrame(loop);document.querySelector('#cast').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await sound()}catch(err){}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
