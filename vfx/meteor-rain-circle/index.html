<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Meteor Rain Circle VFX</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050207;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#fff0e8;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ffe0c5;background:#1b0906dd;border:1px solid #71351d;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.cast{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #ffd19b;color:white;font-weight:bold;font-size:14px;background:radial-gradient(circle,#ff8a24,#a72808 62%,#2a0602);box-shadow:0 0 26px #ff8a28,0 0 65px #ff3008,inset 0 0 26px #fff0bf}#flash{position:fixed;inset:0;z-index:15;background:#fff0d0;opacity:0;pointer-events:none;transition:opacity .12s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Meteor Rain Circle · hujan meteor vertikal · radius 20 unit</div><div id="flash"></div><button class="cast" id="cast">METEOR</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x050207);scene.fog=new THREE.FogExp2(0x100606,.011);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,130);camera.position.set(0,21,28);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=60;controls.maxPolarAngle=Math.PI*.48;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2.2,.6,.08);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x55321f,0x080202,.55));const groundMat=new THREE.MeshStandardMaterial({color:0x201511,roughness:.96});const ground=new THREE.Mesh(new THREE.PlaneGeometry(65,65,30,30),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(58,58,0xff6b28,0x512112);grid.position.y=.07;grid.material.transparent=true;grid.material.opacity=.26;scene.add(grid);for(let i=0;i<75;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.55,0),groundMat);m.position.set((Math.random()-.5)*48,.12,(Math.random()-.5)*48);m.scale.y=.5+Math.random();m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);scene.add(m)}const zone=new THREE.Mesh(new THREE.RingGeometry(19.7,20,128),new THREE.MeshBasicMaterial({color:0xff5a18,transparent:true,opacity:.22,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));zone.rotation.x=-Math.PI/2;zone.position.y=.12;scene.add(zone);const fx=new THREE.Group();scene.add(fx);const hotMat=new THREE.MeshBasicMaterial({color:0xffb03a});const rockMat=new THREE.MeshStandardMaterial({color:0x2b1510,emissive:0x7a1500,emissiveIntensity:1.5,roughness:.75});const glowMat=new THREE.MeshBasicMaterial({color:0xff4a0a,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});let meteors=[],impacts=[],sparks=[],active=false,start=0,nextSpawn=0,AC=null;function randomCircle(){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*19;return new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r)}function spawnMeteor(now){const p=randomCircle(),g=new THREE.Group(),rock=new THREE.Mesh(new THREE.IcosahedronGeometry(.28+Math.random()*.32,1),rockMat),glow=new THREE.Mesh(new THREE.SphereGeometry(.55,10,8),glowMat);g.add(glow,rock);g.position.set(p.x,25+Math.random()*12,p.z);const trail=new THREE.Mesh(new THREE.CylinderGeometry(.08,.45,7+Math.random()*5,8,1,true),new THREE.MeshBasicMaterial({color:0xff6a12,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));trail.position.y=4;g.add(trail);const core=new THREE.Mesh(new THREE.CylinderGeometry(.025,.12,8,6),new THREE.MeshBasicMaterial({color:0xffe5a5,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));core.position.y=4.5;g.add(core);g.userData={v:-(22+Math.random()*12),born:now};fx.add(g);meteors.push(g)}function impact(p,now){const light=new THREE.PointLight(0xff5b18,38,13,2);light.position.set(p.x,.7,p.z);scene.add(light);const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.07,8,48),new THREE.MeshBasicMaterial({color:0xff8a32,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.x=Math.PI/2;ring.position.set(p.x,.18,p.z);ring.userData={born:now,light};fx.add(ring);impacts.push(ring);for(let i=0;i<14;i++){const s=new THREE.Mesh(new THREE.TetrahedronGeometry(.04+Math.random()*.11),hotMat.clone());s.position.set(p.x,.3,p.z);s.userData={born:now,life:300+Math.random()*500,v:new THREE.Vector3((Math.random()-.5)*7,2+Math.random()*6,(Math.random()-.5)*7)};fx.add(s);sparks.push(s)}const F=document.querySelector('#flash');F.style.opacity='.16';setTimeout(()=>F.style.opacity='0',35)}async function sound(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();const t=AC.currentTime,m=AC.createGain();m.gain.value=.7;m.connect(AC.destination);function noise(s,d,g,f1,f2){const sr=AC.sampleRate,b=AC.createBuffer(1,sr*d|0,sr),z=b.getChannelData(0);for(let i=0;i<z.length;i++)z[i]=Math.random()*2-1;const q=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();q.buffer=b;f.type='bandpass';f.Q.value=.6;f.frequency.setValueAtTime(f1,t+s);f.frequency.exponentialRampToValueAtTime(f2,t+s+d);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+d);q.connect(f).connect(a).connect(m);q.start(t+s)}function boom(s,g){const o=AC.createOscillator(),a=AC.createGain();o.type='sine';o.frequency.setValueAtTime(100,t+s);o.frequency.exponentialRampToValueAtTime(28,t+s+.45);a.gain.setValueAtTime(g,t+s);a.gain.exponentialRampToValueAtTime(.001,t+s+.5);o.connect(a).connect(m);o.start(t+s);o.stop(t+s+.5)}noise(0,3.4,.24,4000,450);for(let i=0;i<12;i++){const s=.25+i*.24+Math.random()*.12;noise(s,.15,.35,7000,500);boom(s+.08,.25)}}function cast(){if(active)return;active=true;start=performance.now();nextSpawn=start;const F=document.querySelector('#flash');F.style.opacity='.35';setTimeout(()=>F.style.opacity='0',60)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const age=now-start;if(age<3100&&now>=nextSpawn){spawnMeteor(now);if(Math.random()>.25)spawnMeteor(now);nextSpawn=now+85+Math.random()*90}if(age>3800)active=false}meteors=meteors.filter(m=>{const dt=Math.min(.035,(now-m.userData.born)/1000);m.position.y+=m.userData.v*.016;m.rotation.x+=.08;m.rotation.z+=.06;if(m.position.y<=.4){impact(m.position,now);fx.remove(m);return false}return true});impacts=impacts.filter(r=>{const a=now-r.userData.born;if(a>650){scene.remove(r.userData.light);fx.remove(r);return false}r.scale.setScalar(1+a/100);r.material.opacity=1-a/650;r.userData.light.intensity=38*(1-a/650);return true});sparks=sparks.filter(s=>{const a=now-s.userData.born;if(a>s.userData.life){fx.remove(s);return false}s.position.addScaledVector(s.userData.v,.016);s.userData.v.y-=.12;s.material.opacity=1-a/s.userData.life;return true});zone.material.opacity=.16+Math.sin(now*.006)*.08;composer.render()}requestAnimationFrame(loop);document.querySelector('#cast').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await sound()}catch(err){}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
