<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brutal Meteor Rain Circle</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050207;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#fff0e8;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ffe0c5;background:#1b0906dd;border:1px solid #71351d;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.cast{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #ffd19b;color:white;font-weight:bold;font-size:14px;background:radial-gradient(circle,#ff8a24,#a72808 62%,#2a0602);box-shadow:0 0 26px #ff8a28,0 0 65px #ff3008,inset 0 0 26px #fff0bf}#flash{position:fixed;inset:0;z-index:15;background:#fff0d0;opacity:0;pointer-events:none;transition:opacity .07s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Meteor Rain · small fireballs · brutal · radius 20 unit</div><div id="flash"></div><button class="cast" id="cast">METEOR</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x050207);scene.fog=new THREE.FogExp2(0x100606,.009);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,150);camera.position.set(0,22,29);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.15));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=60;controls.maxPolarAngle=Math.PI*.48;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.85,.5,.1);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x55321f,0x080202,.55));const groundMat=new THREE.MeshStandardMaterial({color:0x201511,roughness:.96});const ground=new THREE.Mesh(new THREE.PlaneGeometry(65,65),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(58,58,0xff6b28,0x512112);grid.position.y=.07;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);for(let i=0;i<45;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.45,0),groundMat);m.position.set((Math.random()-.5)*48,.12,(Math.random()-.5)*48);scene.add(m)}const zone=new THREE.Mesh(new THREE.RingGeometry(19.6,20,96),new THREE.MeshBasicMaterial({color:0xff5a18,transparent:true,opacity:.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));zone.rotation.x=-Math.PI/2;zone.position.y=.12;scene.add(zone);const fx=new THREE.Group();scene.add(fx);const rockGeo=new THREE.IcosahedronGeometry(1,1),fireGeo=new THREE.SphereGeometry(1,7,5),sparkGeo=new THREE.TetrahedronGeometry(.06),rockMat=new THREE.MeshStandardMaterial({color:0x28100a,emissive:0xff3600,emissiveIntensity:2.3,roughness:.82}),fireMat=new THREE.MeshBasicMaterial({color:0xff5a08,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false}),hotMat=new THREE.MeshBasicMaterial({color:0xffffb0,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}),sparkMat=new THREE.MeshBasicMaterial({color:0xffa025,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});let meteors=[],impacts=[],sparks=[],active=false,start=0,nextSpawn=0,AC=null;function point(){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*19;return{x:Math.cos(a)*r,z:Math.sin(a)*r}}function spawn(){const p=point(),g=new THREE.Group(),size=.28+Math.random()*.24,rock=new THREE.Mesh(rockGeo,rockMat);rock.scale.setScalar(size);g.add(rock);const fire=new THREE.Mesh(fireGeo,fireMat);fire.scale.setScalar(size*1.65);g.add(fire);const core=new THREE.Mesh(fireGeo,hotMat);core.scale.setScalar(size*.68);g.add(core);const tail=new THREE.Mesh(fireGeo,fireMat);tail.scale.set(size*.72,size*1.8,size*.72);tail.position.y=size*1.65;g.add(tail);g.position.set(p.x,32+Math.random()*14,p.z);g.userData={speed:58+Math.random()*28};fx.add(g);meteors.push(g)}function hit(p,now){const ring=new THREE.Mesh(new THREE.TorusGeometry(.35,.055,6,24),new THREE.MeshBasicMaterial({color:0xffa13b,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.x=Math.PI/2;ring.position.set(p.x,.16,p.z);ring.userData={born:now};fx.add(ring);impacts.push(ring);for(let i=0;i<4;i++){const s=new THREE.Mesh(sparkGeo,sparkMat);s.position.set(p.x,.2,p.z);s.userData={born:now,life:180+Math.random()*220,v:new THREE.Vector3((Math.random()-.5)*7,1.5+Math.random()*5,(Math.random()-.5)*7)};fx.add(s);sparks.push(s)}}async function sound(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();const t=AC.currentTime,m=AC.createGain();m.gain.value=.65;m.connect(AC.destination);const sr=AC.sampleRate,b=AC.createBuffer(1,sr*3.8|0,sr),z=b.getChannelData(0);for(let i=0;i<z.length;i++)z[i]=(Math.random()*2-1)*Math.exp(-i/z.length*.5);const q=AC.createBufferSource(),f=AC.createBiquadFilter();q.buffer=b;f.type='bandpass';f.frequency.value=1400;f.Q.value=.5;q.connect(f).connect(m);q.start(t)}function cast(){if(active)return;active=true;start=performance.now();nextSpawn=start;const F=document.querySelector('#flash');F.style.opacity='.3';setTimeout(()=>F.style.opacity='0',40)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const age=now-start;if(age<3500&&now>=nextSpawn){const count=4+Math.floor(Math.random()*3);for(let i=0;i<count;i++)spawn();nextSpawn=now+55+Math.random()*35}if(age>4200)active=false}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.position.y-=m.userData.speed*.016;m.rotation.y+=.05;if(m.position.y<=.4){hit(m.position,now);fx.remove(m);meteors.splice(i,1)}}impacts=impacts.filter(r=>{const a=now-r.userData.born;if(a>350){fx.remove(r);return false}r.scale.setScalar(1+a/45);r.material.opacity=.85*(1-a/350);return true});sparks=sparks.filter(s=>{const a=now-s.userData.born;if(a>s.userData.life){fx.remove(s);return false}s.position.addScaledVector(s.userData.v,.016);s.userData.v.y-=.15;s.material.opacity=1-a/s.userData.life;return true});zone.material.opacity=.27+Math.sin(now*.012)*.1;composer.render()}requestAnimationFrame(loop);document.querySelector('#cast').addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await sound()}catch(err){}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
