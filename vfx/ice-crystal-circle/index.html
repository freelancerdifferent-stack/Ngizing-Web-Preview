<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ice Crystal Circle VFX</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040913;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#eaf8ff;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#d7f5ff;background:#071523dd;border:1px solid #2e6c8c;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.cast{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #bff5ff;color:white;font-weight:bold;font-size:15px;background:radial-gradient(circle,#7fe8ff,#1f73aa 62%,#08213d);box-shadow:0 0 26px #76ebff,0 0 65px #3bb3ff,inset 0 0 26px #f1ffff}#flash{position:fixed;inset:0;z-index:15;background:#dff8ff;opacity:0;pointer-events:none;transition:opacity .15s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Ice Crystal Circle · snowflake frost vapor · 2s hold</div><div id="flash"></div><button class="cast" id="cast">ICE</button><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x040913);scene.fog=new THREE.FogExp2(0x08131d,.0125);const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,150);camera.position.set(0,20,28);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.8,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=60;controls.maxPolarAngle=Math.PI*.48;const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.55,.5,.12);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0xbcefff,0x07101b,1));const moon=new THREE.DirectionalLight(0xe5fbff,1.7);moon.position.set(-7,16,7);scene.add(moon);const rim=new THREE.DirectionalLight(0x58cfff,1.1);rim.position.set(8,8,-10);scene.add(rim);const groundMat=new THREE.MeshStandardMaterial({color:0x131c24,roughness:.96}),ground=new THREE.Mesh(new THREE.PlaneGeometry(64,64),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(58,58,0x59d7ff,0x173e59);grid.position.y=.08;grid.material.transparent=true;grid.material.opacity=.24;scene.add(grid);for(let i=0;i<40;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.14+Math.random()*.48,0),groundMat);r.position.set((Math.random()-.5)*48,.12,(Math.random()-.5)*48);r.scale.y=.55+Math.random()*.9;scene.add(r)}const areaRing=new THREE.Mesh(new THREE.RingGeometry(17.6,18,96),new THREE.MeshBasicMaterial({color:0x8eefff,transparent:true,opacity:.22,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));areaRing.rotation.x=-Math.PI/2;areaRing.position.y=.11;scene.add(areaRing);const areaFill=new THREE.Mesh(new THREE.CircleGeometry(17.55,64),new THREE.MeshBasicMaterial({color:0x57d9ff,transparent:true,opacity:.04,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));areaFill.rotation.x=-Math.PI/2;areaFill.position.y=.1;scene.add(areaFill);const fx=new THREE.Group();scene.add(fx);const coldLight=new THREE.PointLight(0x92f5ff,0,40,1.6);coldLight.position.set(0,3,0);scene.add(coldLight);
const crystalGeo=new THREE.ConeGeometry(.45,3.7,6,1);crystalGeo.translate(0,1.85,0);const shardGeo=new THREE.TetrahedronGeometry(.11),vaporGeo=new THREE.SphereGeometry(1,8,6);function snowflakeGeo(){const pts=[];for(let a=0;a<6;a++){const q=a*Math.PI/3,x=Math.cos(q),y=Math.sin(q);pts.push(new THREE.Vector3(0,0,0),new THREE.Vector3(x,0,y));for(const t of [.48,.72]){const bx=x*t,by=y*t,l=.22,qa=q+Math.PI*.72,qb=q-Math.PI*.72;pts.push(new THREE.Vector3(bx,0,by),new THREE.Vector3(bx+Math.cos(qa)*l,0,by+Math.sin(qa)*l),new THREE.Vector3(bx,0,by),new THREE.Vector3(bx+Math.cos(qb)*l,0,by+Math.sin(qb)*l))}}return new THREE.BufferGeometry().setFromPoints(pts)}const snowGeo=snowflakeGeo();function iceMaterial(){return new THREE.MeshPhysicalMaterial({color:0xc7f3ff,transparent:true,opacity:.52,roughness:.08,transmission:.62,thickness:.7,ior:1.31,clearcoat:1,clearcoatRoughness:.06,attenuationColor:new THREE.Color(0x8feaff),attenuationDistance:2.7,side:THREE.DoubleSide,depthWrite:false})}const edgeMat=new THREE.MeshBasicMaterial({color:0xa9f4ff,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false,wireframe:true}),mistMat=new THREE.MeshBasicMaterial({color:0xd9fbff,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false}),vaporMat=new THREE.MeshBasicMaterial({color:0xd8f7ff,transparent:true,opacity:.08,depthWrite:false}),ringMat=new THREE.MeshBasicMaterial({color:0xd9fdff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}),snowMat=new THREE.LineBasicMaterial({color:0xe8fdff,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});let crystals=[],shards=[],rings=[],vapors=[],snowflakes=[],active=false,start=0,audioCtx=null;
function setupAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function iceSound(){if(!audioCtx||audioCtx.state!=='running')return;const c=audioCtx,t=c.currentTime,m=c.createGain();m.gain.setValueAtTime(.0001,t);m.gain.exponentialRampToValueAtTime(.52,t+.025);m.gain.exponentialRampToValueAtTime(.0001,t+1.55);m.connect(c.destination);const low=c.createOscillator(),lg=c.createGain();low.type='sine';low.frequency.setValueAtTime(150,t);low.frequency.exponentialRampToValueAtTime(58,t+.65);lg.gain.setValueAtTime(.34,t);lg.gain.exponentialRampToValueAtTime(.0001,t+.8);low.connect(lg).connect(m);low.start(t);low.stop(t+.85);for(let i=0;i<11;i++){const o=c.createOscillator(),g=c.createGain(),tt=t+.05+i*.045+Math.random()*.035;o.type=i%2?'triangle':'sine';o.frequency.setValueAtTime(900+Math.random()*1500,tt);o.frequency.exponentialRampToValueAtTime(1800+Math.random()*2400,tt+.09);g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.1+Math.random()*.08,tt+.006);g.gain.exponentialRampToValueAtTime(.0001,tt+.14);o.connect(g).connect(m);o.start(tt);o.stop(tt+.16)}}function randInCircle(R){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*R;return{x:Math.cos(a)*r,z:Math.sin(a)*r,r}}function clearFx(){[...crystals.map(x=>x.group),...shards.map(x=>x.mesh),...rings.map(x=>x.mesh),...vapors.map(x=>x.mesh),...snowflakes.map(x=>x.mesh)].forEach(x=>fx.remove(x));crystals=[];shards=[];rings=[];vapors=[];snowflakes=[]}function makeCrystal(now){const p=randInCircle(17.2),size=.7+(1-p.r/17.2)*.95+Math.random()*.55,h=2+size*(1.9+Math.random()*1.6),g=new THREE.Group();g.position.set(p.x,-.06,p.z);const core=new THREE.Mesh(crystalGeo,iceMaterial());core.scale.set(size*(.42+Math.random()*.36),h/3.7,size*(.38+Math.random()*.3));g.add(core);const edge=new THREE.Mesh(crystalGeo,edgeMat.clone());edge.scale.copy(core.scale).multiplyScalar(1.015);g.add(edge);g.scale.set(1,.04,1);fx.add(g);crystals.push({group:g,core,edge,born:now,rise:480+Math.random()*420,hold:2000,delay:Math.random()*350})}function spawnVapor(now){for(let i=0;i<45;i++){const p=randInCircle(17),m=new THREE.Mesh(vaporGeo,vaporMat.clone()),s=.8+Math.random()*1.8;m.position.set(p.x,.15+Math.random()*.6,p.z);m.scale.set(s*2,.25+Math.random()*.4,s);m.userData.v=new THREE.Vector3((Math.random()-.5)*.012,.004+Math.random()*.008,(Math.random()-.5)*.012);fx.add(m);vapors.push({mesh:m,born:now+Math.random()*350,life:3300+Math.random()*400,base:.04+Math.random()*.055})}}function spawnSnowflakes(now){for(let i=0;i<85;i++){const p=randInCircle(17),m=new THREE.LineSegments(snowGeo,snowMat.clone()),s=.13+Math.random()*.38;m.position.set(p.x,.35+Math.random()*3.8,p.z);m.scale.setScalar(s);m.rotation.set(Math.random()*1.2,Math.random()*Math.PI*2,Math.random()*1.2);m.userData.v=new THREE.Vector3((Math.random()-.5)*.018,.012+Math.random()*.025,(Math.random()-.5)*.018);m.userData.spin=(Math.random()-.5)*.035;fx.add(m);snowflakes.push({mesh:m,born:now+Math.random()*500,life:3000+Math.random()*500,base:.35+Math.random()*.55})}}function burstRing(now){const mesh=new THREE.Mesh(new THREE.TorusGeometry(.8,.08,8,56),ringMat.clone());mesh.rotation.x=Math.PI/2;mesh.position.y=.18;fx.add(mesh);rings.push({mesh,born:now,life:900,max:18.2})}function spawnShards(now){for(let i=0;i<80;i++){const p=randInCircle(17),m=new THREE.Mesh(shardGeo,mistMat.clone());m.position.set(p.x,.18,p.z);m.userData.v=new THREE.Vector3((Math.random()-.5)*.05,.02+Math.random()*.05,(Math.random()-.5)*.05);fx.add(m);shards.push({mesh:m,born:now+Math.random()*250,life:900})}}function cast(sound=true){if(active)return;clearFx();active=true;start=performance.now();if(sound)iceSound();burstRing(start);spawnShards(start);spawnVapor(start);spawnSnowflakes(start);for(let i=0;i<68;i++)makeCrystal(start);const F=document.querySelector('#flash');F.style.opacity='.42';setTimeout(()=>F.style.opacity='0',65)}function updateCrystals(now){crystals=crystals.filter(c=>{const age=now-c.born-c.delay;if(age<0)return true;const total=c.rise+c.hold+520;if(age>total){fx.remove(c.group);return false}if(age<=c.rise){const e=1-Math.pow(1-age/c.rise,3);c.group.scale.y=.04+e*.96}else if(age<=c.rise+c.hold){c.group.scale.y=1;c.core.material.opacity=.52;c.edge.material.opacity=.28}else{const f=(age-c.rise-c.hold)/520;c.core.material.opacity=.52*(1-f);c.edge.material.opacity=.28*(1-f)}return true})}function updateShards(now){shards=shards.filter(s=>{const age=now-s.born;if(age<0)return true;if(age>s.life){fx.remove(s.mesh);return false}s.mesh.position.add(s.mesh.userData.v);s.mesh.material.opacity=.2*(1-age/s.life);return true})}function updateVapor(now){vapors=vapors.filter(v=>{const age=now-v.born;if(age<0){v.mesh.visible=false;return true}v.mesh.visible=true;if(age>v.life){fx.remove(v.mesh);return false}v.mesh.position.add(v.mesh.userData.v);let env=age<300?age/300:age<2300?1:Math.max(0,(v.life-age)/(v.life-2300));v.mesh.material.opacity=v.base*env;v.mesh.scale.x*=1.001;v.mesh.scale.z*=1.001;return true})}function updateSnow(now){snowflakes=snowflakes.filter(s=>{const age=now-s.born;if(age<0){s.mesh.visible=false;return true}s.mesh.visible=true;if(age>s.life){fx.remove(s.mesh);return false}const u=age/s.life;s.mesh.position.add(s.mesh.userData.v);s.mesh.rotation.y+=s.mesh.userData.spin;s.mesh.rotation.z+=s.mesh.userData.spin*.45;const env=age<250?age/250:age<2300?1:Math.max(0,(s.life-age)/(s.life-2300));s.mesh.material.opacity=s.base*env;s.mesh.scale.multiplyScalar(1.00025);return true})}function updateRings(now){rings=rings.filter(r=>{const age=now-r.born;if(age>r.life){fx.remove(r.mesh);return false}const u=age/r.life;r.mesh.scale.setScalar(1+u*(r.max/.8));r.mesh.material.opacity=.9*(1-u);return true})}function loop(now){requestAnimationFrame(loop);controls.update();if(active){const age=now-start;updateCrystals(now);updateShards(now);updateVapor(now);updateSnow(now);updateRings(now);coldLight.intensity=7+Math.max(0,1-age/1100)*30;areaRing.material.opacity=.22+Math.sin(now*.009)*.05;bloom.strength=1.5+Math.max(0,1-age/800)*.45;if(age>4300&&!crystals.length&&!shards.length&&!rings.length&&!vapors.length&&!snowflakes.length){active=false;coldLight.intensity=0}}composer.render()}requestAnimationFrame(loop);document.querySelector('#cast').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setupAudio();cast(true)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(()=>cast(false),900);
