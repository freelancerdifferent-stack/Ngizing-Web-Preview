<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightning Q</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c}canvas{width:100%;height:100%;display:block}.q{position:fixed;right:28px;bottom:28px;width:82px;height:82px;border-radius:50%;font-size:30px;color:white;background:#12658b;border:3px solid #7beeff;box-shadow:0 0 25px #36dfff}.back{position:fixed;left:18px;top:18px;color:white;z-index:2;font:16px Arial;text-decoration:none}</style></head><body><a class="back" href="../../">← VFX</a><canvas id="fx"></canvas><button class="q" id="q">Q</button><script>const c=document.querySelector('#fx'),x=c.getContext('2d');function resize(){c.width=innerWidth;c.height=innerHeight}resize();addEventListener('resize',resize);function bolt(a,b,n,j){let p=[a];for(let i=1;i<n;i++){let t=i/n;p.push({x:a.x+(b.x-a.x)*t+(Math.random()-.5)*j,y:a.y+(b.y-a.y)*t+(Math.random()-.5)*j})}p.push(b);return p}function line(p,w,a){x.save();x.globalCompositeOperation='lighter';x.strokeStyle='rgba(150,235,255,'+a+')';x.lineWidth=w;x.shadowColor='#35dfff';x.shadowBlur=22;x.beginPath();x.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)x.lineTo(p[i].x,p[i].y);x.stroke();x.restore()}function cast(){let s=performance.now();function frame(now){let t=(now-s)/650;x.clearRect(0,0,c.width,c.height);if(t>=1)return;let f=1-t,a={x:c.width*.28,y:c.height*.62},b={x:c.width*.7,y:c.height*.4};line(bolt(a,b,18,28),10,f*.35);line(bolt(a,b,18,18),3,f);line(bolt({x:b.x,y:-20},b,20,35),12,f*.35);line(bolt({x:b.x,y:-20},b,20,18),3,f);x.save();x.globalCompositeOperation='lighter';x.strokeStyle='rgba(80,225,255,'+f+')';x.lineWidth=4;x.shadowColor='#35e8ff';x.shadowBlur=18;x.beginPath();x.ellipse(b.x,b.y,30+t*130,(30+t*130)*.35,0,0,Math.PI*2);x.stroke();x.restore();for(let i=0;i<7;i++){let ang=i*Math.PI*2/7,d={x:b.x+Math.cos(ang)*(50+t*100),y:b.y+Math.sin(ang)*(25+t*45)};line(bolt(b,d,7,12),2,f*.7)}requestAnimationFrame(frame)}requestAnimationFrame(frame)}document.querySelector('#q').addEventListener('click',cast);setTimeout(cast,500)</script></body></html>
