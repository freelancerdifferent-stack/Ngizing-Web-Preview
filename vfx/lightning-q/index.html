<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Q 3D Arena</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#effcff;text-decoration:none;font-size:18px;text-shadow:0 0 12px #5ce7ff}.label{position:fixed;right:18px;top:18px;z-index:20;color:#dffaff;text-align:right;font-weight:bold;text-shadow:0 0 12px #30cfff}.label small{display:block;font-size:10px;color:#7194a8}.q{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #8ef5ff;color:white;font-size:34px;background:radial-gradient(circle,#1788bc,#063452 65%,#02101b);box-shadow:0 0 24px #31ddff,0 0 55px #0875ff,inset 0 0 25px #50eaff}.q:active{transform:scale(.9)}#flash{position:fixed;inset:0;z-index:15;background:#eaffff;opacity:0;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="label">LIGHTNING Q<small>TRUE 3D ARENA</small></div><div id="flash"></div><button class="q" id="q">Q</button><script type="module">import * as THREE from'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);scene.fog=new THREE.FogExp2(0x07111b,.026);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(8,5.2,13);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.72;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.65,.55,.12);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x284866,0x050404,.55));const moon=new THREE.DirectionalLight(0x6b8ca8,1.2);moon.position.set(-7,10,5);moon.castShadow=true;scene.add(moon);const rockMat=new THREE.MeshStandardMaterial({color:0x20272c,roughness:.93,metalness:.04});const groundGeo=new THREE.PlaneGeometry(50,50,55,55);let pa=groundGeo.attributes.position;for(let i=0;i<pa.count;i++){let X=pa.getX(i),Y=pa.getY(i),d=Math.hypot(X,Y);pa.setZ(i,(Math.sin(X*1.7)+Math.cos(Y*1.35)+Math.sin((X+Y)*2.1))*.10+Math.random()*.12-(d<2?Math.max(0,1-d/2)*.35:0))}groundGeo.computeVertexNormals();const ground=new THREE.Mesh(groundGeo,rockMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function rock(x,z,s,y=0){let geo=new THREE.DodecahedronGeometry(s,1),p=geo.attributes.position;for(let i=0;i<p.count;i++){let k=.78+Math.random()*.42;p.setXYZ(i,p.getX(i)*k,p.getY(i)*(.7+Math.random()*.6),p.getZ(i)*k)}geo.computeVertexNormals();let m=new THREE.Mesh(geo,rockMat);m.position.set(x,y+s*.45,z);m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);m.castShadow=m.receiveShadow=true;scene.add(m);return m}for(let i=0;i<55;i++){let a=Math.random()*Math.PI*2,r=3+Math.random()*18,s=.18+Math.random()*.75;rock(Math.cos(a)*r,Math.sin(a)*r,s)}for(let i=0;i<11;i++){let side=i%2?1:-1,x=side*(5+Math.random()*8),z=-4+Math.random()*15,s=1.3+Math.random()*2.5;let m=rock(x,z,s);m.scale.y=1.5+Math.random()*2}const crater=new THREE.Mesh(new THREE.TorusGeometry(1.35,.24,10,60),new THREE.MeshStandardMaterial({color:0x11181d,roughness:.9}));crater.rotation.x=Math.PI/2;crater.position.y=.05;scene.add(crater);const crackMat=new THREE.MeshBasicMaterial({color:0x2acbff,transparent:true,opacity:0,blending:THREE.AdditiveBlending});let cracks=[];for(let i=0;i<14;i++){let a=i/14*Math.PI*2+Math.random()*.2,len=1.3+Math.random()*3.8,w=.018+Math.random()*.025;let q=new THREE.Mesh(new THREE.BoxGeometry(w,.018,len),crackMat.clone());q.position.set(Math.sin(a)*len*.5,.025,Math.cos(a)*len*.5);q.rotation.y=a;scene.add(q);cracks.push(q)}const impact=new THREE.PointLight(0x4adfff,0,25,1.5);impact.position.set(0,.5,0);impact.castShadow=true;scene.add(impact);const fx=new THREE.Group();scene.add(fx);function gm(c,o){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function bolt(s,e,n=24,j=.3,r=.045){let pts=[s.clone()];for(let i=1;i<n;i++){let t=i/n,p=s.clone().lerp(e,t);p.x+=(Math.random()-.5)*j;p.z+=(Math.random()-.5)*j;p.y+=(Math.random()-.5)*j*.5;pts.push(p)}pts.push(e.clone());let curve=new THREE.CatmullRomCurve3(pts),G=new THREE.Group();G.add(new THREE.Mesh(new THREE.TubeGeometry(curve,n*2,r*4,5),gm(0x147cff,.17)));G.add(new THREE.Mesh(new THREE.TubeGeometry(curve,n*2,r,5),gm(0xd9ffff,1)));return G}let active=false,st=0,bolts=[],rings=[],debris=[];function clean(){for(const o of [...bolts,...rings,...debris]){fx.remove(o);o.traverse?.(n=>{n.geometry?.dispose();n.material?.dispose()})}bolts=[];rings=[];debris=[]}function cast(){if(active)return;clean();active=true;st=performance.now();let main=bolt(new THREE.Vector3(0,14,-.2),new THREE.Vector3(0,.12,0),40,.65,.1);fx.add(main);bolts.push(main);for(let i=0;i<16;i++){let y=1+Math.random()*11,a=Math.random()*Math.PI*2,L=2+Math.random()*6,b=bolt(new THREE.Vector3(0,y,0),new THREE.Vector3(Math.cos(a)*L,y+(Math.random()-.5)*2,Math.sin(a)*L),14,.5,.025);fx.add(b);bolts.push(b)}for(let i=0;i<18;i++){let a=i/18*Math.PI*2+Math.random()*.15,L=2+Math.random()*5,b=bolt(new THREE.Vector3(0,.09,0),new THREE.Vector3(Math.cos(a)*L,.08,Math.sin(a)*L),12,.22,.025);fx.add(b);bolts.push(b)}for(let i=0;i<4;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(.6,.045,8,70),gm(0x68eaff,.8));r.rotation.x=Math.PI/2;r.position.y=.09;fx.add(r);rings.push(r)}for(let i=0;i<75;i++){let d=new THREE.Mesh(new THREE.TetrahedronGeometry(.04+Math.random()*.16),new THREE.MeshStandardMaterial({color:0x26333a,roughness:.8}));d.position.set(0,.15,0);d.userData.v=new THREE.Vector3((Math.random()-.5)*10,2+Math.random()*7,(Math.random()-.5)*10);fx.add(d);debris.push(d)}const F=document.querySelector('#flash');F.style.transition='none';F.style.opacity='.9';setTimeout(()=>{F.style.transition='opacity .3s';F.style.opacity='0'},45)}function animate(now){requestAnimationFrame(animate);let idle=now*.00018;if(active){let ms=now-st,t=ms/2100,fade=Math.max(0,1-t);impact.intensity=75*Math.max(0,1-ms/1100)*(0.8+Math.random()*.4);cracks.forEach((c,i)=>c.material.opacity=Math.max(0,fade*.8)*(0.75+Math.sin(now*.02+i)*.25));bolts.forEach(b=>{b.visible=Math.random()>.07;b.scale.setScalar(.94+Math.random()*.12)});rings.forEach((r,i)=>{r.scale.setScalar(.5+Math.min(1,ms/900)*(5+i*1.6));r.material.opacity=fade*(.8-i*.12)});let dt=Math.min(ms,1500)/1000;debris.forEach(d=>{d.position.copy(d.userData.v).multiplyScalar(dt);d.position.y+=.15-4.5*dt*dt;d.rotation.x+=.06;d.rotation.y+=.04});let shake=Math.max(0,1-ms/650);camera.position.set(8+(Math.random()-.5)*.25*shake,5.2+(Math.random()-.5)*.16*shake,13+(Math.random()-.5)*.2*shake);camera.lookAt(0,1.6,0);bloom.strength=1.7+Math.max(0,1-ms/850)*2.6;if(t>=1){active=false;impact.intensity=0;cracks.forEach(c=>c.material.opacity=0);clean()}}else{camera.position.x=8+Math.sin(idle)*.4;camera.lookAt(0,1.3,0);bloom.strength=1.55}composer.render()}requestAnimationFrame(animate);document.querySelector('#q').addEventListener('pointerdown',e=>{e.preventDefault();cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
