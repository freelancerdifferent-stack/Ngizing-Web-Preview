<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cinematic Lightning Q</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;touch-action:none}canvas{width:100%;height:100%;display:block}.q{position:fixed;right:28px;bottom:28px;width:86px;height:86px;border-radius:50%;font-size:32px;color:#fff;background:radial-gradient(circle,#147ba8,#07263d);border:3px solid #8df4ff;box-shadow:0 0 30px #29dfff,inset 0 0 20px #35dfff;z-index:4}.back{position:fixed;left:20px;top:20px;color:#dffaff;z-index:4;font:18px Arial;text-decoration:none;text-shadow:0 0 10px #40dfff}.flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:3}.shake{animation:shake .28s linear}@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(4px,3px)}}</style></head><body><a class="back" href="../../">← VFX</a><canvas id="fx"></canvas><div id="flash" class="flash"></div><button class="q" id="q">Q</button><script>const c=document.querySelector('#fx'),x=c.getContext('2d'),fl=document.querySelector('#flash');let particles=[];function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);function bolt(a,b,n,j){let p=[a],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;for(let i=1;i<n;i++){let t=i/n,o=(Math.random()-.5)*j*Math.sin(Math.PI*t);p.push({x:a.x+dx*t-dy/l*o,y:a.y+dy*t+dx/l*o})}p.push(b);return p}function line(p,w,a,blur=25){x.save();x.globalCompositeOperation='lighter';x.strokeStyle=`rgba(72,188,255,${a*.7})`;x.lineWidth=w*2.8;x.shadowColor='#168cff';x.shadowBlur=blur*1.8;x.beginPath();x.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)x.lineTo(p[i].x,p[i].y);x.stroke();x.strokeStyle=`rgba(190,245,255,${a})`;x.lineWidth=w;x.shadowColor='#65eaff';x.shadowBlur=blur;x.stroke();x.strokeStyle=`rgba(255,255,255,${Math.min(1,a*1.25)})`;x.lineWidth=Math.max(1,w*.22);x.shadowBlur=5;x.stroke();x.restore()}function spawn(b){particles=[];for(let i=0;i<85;i++){let a=Math.random()*Math.PI*2,s=80+Math.random()*320;particles.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.5-80,r:1+Math.random()*3})}}function cast(){let s=performance.now(),b={x:innerWidth*.52,y:innerHeight*.48};spawn(b);fl.style.transition='none';fl.style.opacity='.85';setTimeout(()=>{fl.style.transition='opacity .32s';fl.style.opacity='0'},35);document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');function frame(now){let ms=now-s,t=ms/1250;x.clearRect(0,0,innerWidth,innerHeight);if(t>=1)return;let b={x:innerWidth*.52,y:innerHeight*.48},fade=Math.max(0,1-t),pulse=.7+Math.random()*.3;let sky={x:b.x+(Math.random()-.5)*55,y:-40};if(ms<720){line(bolt(sky,b,25,75),18,fade*.38*pulse,45);line(bolt(sky,b,27,48),7,fade*pulse,28);for(let k=0;k<4;k++){let yy=innerHeight*(.1+.15*k),end={x:b.x+(Math.random()-.5)*innerWidth*.75,y:yy+Math.random()*120};line(bolt({x:b.x,y:yy},end,10,38),2.2,fade*.55,15)}}let glow=x.createRadialGradient(b.x,b.y,0,b.x,b.y,220*(.35+t));glow.addColorStop(0,`rgba(255,255,255,${fade*.95})`);glow.addColorStop(.12,`rgba(80,210,255,${fade*.75})`);glow.addColorStop(.5,`rgba(20,100,255,${fade*.18})`);glow.addColorStop(1,'rgba(0,20,80,0)');x.fillStyle=glow;x.fillRect(b.x-300,b.y-300,600,600);for(let r=0;r<3;r++){x.save();x.globalCompositeOperation='lighter';x.strokeStyle=`rgba(${r?80:220},${r?210:250},255,${fade*(.8-r*.18)})`;x.lineWidth=5-r;x.shadowColor='#31cfff';x.shadowBlur=28;x.beginPath();let rad=35+t*(145+r*55);x.ellipse(b.x,b.y,rad,rad*.28,0,0,Math.PI*2);x.stroke();x.restore()}for(let i=0;i<12;i++){let a=i*Math.PI*2/12+Math.random()*.18,d=70+t*(140+Math.random()*120),end={x:b.x+Math.cos(a)*d,y:b.y+Math.sin(a)*d*.38};line(bolt(b,end,9,24),2.5,fade*.75,15)}let dt=Math.min(ms,900)/1000;for(let p of particles){let px=p.x+p.vx*dt,py=p.y+p.vy*dt+250*dt*dt;x.save();x.globalCompositeOperation='lighter';x.fillStyle=`rgba(130,230,255,${fade})`;x.shadowColor='#48dfff';x.shadowBlur=12;x.fillRect(px,py,p.r,p.r*3);x.restore()}if(ms<420){x.save();x.globalAlpha=(1-ms/420)*.18;x.fillStyle='#8eeeff';x.fillRect(0,0,innerWidth,innerHeight);x.restore()}requestAnimationFrame(frame)}requestAnimationFrame(frame)}document.querySelector('#q').addEventListener('pointerdown',e=>{e.preventDefault();cast()});setTimeout(cast,500)</script></body></html>
