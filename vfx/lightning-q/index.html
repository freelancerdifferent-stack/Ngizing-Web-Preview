<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Ultimate</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040b;touch-action:none;font-family:Arial}#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#102844 0,#07101d 35%,#01040b 75%)}canvas{position:absolute;inset:0;width:100%;height:100%}.back{position:fixed;left:18px;top:18px;color:#dffaff;z-index:8;text-decoration:none;font-size:17px;text-shadow:0 0 12px #43dcff}.title{position:fixed;top:18px;right:20px;z-index:8;color:#c8f6ff;text-align:right;font-weight:bold;letter-spacing:.08em;text-shadow:0 0 14px #2acfff}.title small{display:block;color:#63869c;font-size:10px;margin-top:4px}.q{position:fixed;right:24px;bottom:25px;width:90px;height:90px;border-radius:50%;font-size:32px;color:white;background:radial-gradient(circle,#269ac6 0,#0a3a5a 55%,#031421 100%);border:3px solid #9bf7ff;box-shadow:0 0 35px #2bdfff,inset 0 0 25px #53eaff;z-index:9}.q:active{transform:scale(.92)}#white{position:fixed;inset:0;background:#dffaff;opacity:0;pointer-events:none;z-index:7}#stage.shake{animation:quake .48s linear}@keyframes quake{0%,100%{transform:translate(0) scale(1)}10%{transform:translate(-9px,5px) scale(1.015)}25%{transform:translate(8px,-7px) scale(1.018)}40%{transform:translate(-6px,-3px) scale(1.012)}60%{transform:translate(5px,6px) scale(1.008)}80%{transform:translate(-3px,2px) scale(1.004)}}</style></head><body><div id="stage"><canvas id="fx"></canvas></div><a class="back" href="../../">← VFX</a><div class="title">LIGHTNING ULTIMATE<small>CINEMATIC VFX</small></div><div id="white"></div><button id="q" class="q">Q</button><script>const cv=document.querySelector('#fx'),ctx=cv.getContext('2d'),stage=document.querySelector('#stage'),white=document.querySelector('#white');let W,H,D=1,running=false,seedBolts=[],debris=[];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);function rand(a,b){return a+Math.random()*(b-a)}function jag(a,b,n,j){let p=[a],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;for(let i=1;i<n;i++){let t=i/n,o=rand(-j,j)*Math.sin(Math.PI*t);p.push({x:a.x+dx*t-dy/L*o,y:a.y+dy*t+dx/L*o})}p.push(b);return p}function stroke(p,w,a,blur=30){ctx.save();ctx.globalCompositeOperation='lighter';for(const z of [[w*5,a*.12,'#087cff',blur*2.4],[w*2.2,a*.3,'#22bfff',blur*1.4],[w,a,'#bff8ff',blur],[Math.max(1,w*.2),Math.min(1,a*1.3),'#fff',5]]){ctx.strokeStyle=z[2];ctx.globalAlpha=z[1];ctx.lineWidth=z[0];ctx.shadowColor=z[2];ctx.shadowBlur=z[3];ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke()}ctx.restore()}function cloud(x,y,r,a){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(50,135,190,${a})`);g.addColorStop(.35,`rgba(15,55,95,${a*.8})`);g.addColorStop(1,'rgba(0,5,20,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}function prep(b){seedBolts=[];for(let i=0;i<14;i++){let ang=rand(0,Math.PI*2),d=rand(90,330);seedBolts.push({a:b,b:{x:b.x+Math.cos(ang)*d,y:b.y+Math.sin(ang)*d*.35},j:rand(15,35)})}debris=[];for(let i=0;i<130;i++){let a=rand(0,Math.PI*2),s=rand(100,500);debris.push({a,s,r:rand(1,4),spin:rand(-5,5)})}}function cast(){if(running)return;running=true;let start=performance.now(),impact={x:W*.5,y:H*.66};prep(impact);white.style.transition='none';white.style.opacity='0';function frame(now){let ms=now-start,t=ms/2100;ctx.clearRect(0,0,W,H);let b={x:W*.5,y:H*.66};for(let i=0;i<8;i++)cloud(W*(.1+i*.13)+Math.sin(ms*.0005+i)*35,H*.12+Math.sin(i)*45,180,.12+Math.sin(ms*.003+i)*.025);if(ms<430){let charge=ms/430;for(let i=0;i<7;i++){let a=i*Math.PI*2/7+ms*.0015,r=(1-charge)*220+40;stroke(jag({x:b.x+Math.cos(a)*r,y:b.y+Math.sin(a)*r*.3},b,10,18),1.8,charge*.55,14)}let g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,100);g.addColorStop(0,`rgba(210,250,255,${charge*.65})`);g.addColorStop(1,'rgba(0,130,255,0)');ctx.fillStyle=g;ctx.fillRect(b.x-120,b.y-120,240,240)}if(ms>=430&&ms<1350){let life=1-(ms-430)/1100,pulse=.75+Math.random()*.25;let top={x:b.x+rand(-22,22),y:-70};stroke(jag(top,b,34,42),30,life*.35*pulse,60);stroke(jag(top,b,36,28),13,life*.8*pulse,42);stroke(jag(top,b,38,17),5.5,pulse,25);for(let i=0;i<6;i++){let sy=H*(.08+i*.085),side=i%2?-1:1,end={x:b.x+side*rand(W*.2,W*.48),y:sy+rand(-40,80)};stroke(jag({x:b.x+rand(-25,25),y:sy},end,13,35),rand(1.5,3.2),life*.65,20)}if(ms<620){white.style.opacity=String(Math.max(0,.95-(ms-430)/210));stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake')}else white.style.opacity='0'}if(ms>450){let u=Math.min(1,(ms-450)/1000),fade=Math.max(0,1-(ms-650)/1450);let g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,260+u*180);g.addColorStop(0,`rgba(255,255,255,${fade*.92})`);g.addColorStop(.08,`rgba(100,230,255,${fade*.72})`);g.addColorStop(.35,`rgba(25,120,255,${fade*.28})`);g.addColorStop(1,'rgba(0,20,80,0)');ctx.fillStyle=g;ctx.fillRect(b.x-500,b.y-400,1000,800);for(let r=0;r<4;r++){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(90,225,255,${fade*(.8-r*.12)})`;ctx.lineWidth=6-r;ctx.shadowColor='#39dfff';ctx.shadowBlur=30;ctx.beginPath();let R=45+u*(150+r*85);ctx.ellipse(b.x,b.y,R,R*.22,0,0,Math.PI*2);ctx.stroke();ctx.restore()}for(const z of seedBolts)stroke(jag(z.a,{x:z.b.x*u+b.x*(1-u),y:z.b.y*u+b.y*(1-u)},10,z.j),rand(1.3,3),fade*.72,18);let dt=(ms-450)/1000;for(const d of debris){let px=b.x+Math.cos(d.a)*d.s*dt,py=b.y+Math.sin(d.a)*d.s*.42*dt-130*dt+260*dt*dt;ctx.save();ctx.translate(px,py);ctx.rotate(d.spin*dt);ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(120,225,255,${fade})`;ctx.shadowColor='#43dfff';ctx.shadowBlur=12;ctx.fillRect(-d.r/2,-d.r*2,d.r,d.r*4);ctx.restore()}}if(t<1)requestAnimationFrame(frame);else{ctx.clearRect(0,0,W,H);white.style.opacity='0';running=false}}requestAnimationFrame(frame)}document.querySelector('#q').addEventListener('pointerdown',e=>{e.preventDefault();cast()});setTimeout(cast,700)</script></body></html>
