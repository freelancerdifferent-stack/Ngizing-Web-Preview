<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Q WebGL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#eaffff;text-decoration:none;font-size:18px;text-shadow:0 0 12px #45dfff}.tag{position:fixed;right:18px;top:18px;z-index:20;color:#dffaff;text-align:right;font-weight:700;text-shadow:0 0 12px #2bcfff}.tag small{display:block;font-size:10px;color:#7399ae;margin-top:3px}.q{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #8ef4ff;color:#fff;font-size:34px;background:radial-gradient(circle,#1787bd,#063452 65%,#02101b);box-shadow:0 0 22px #2bdfff,0 0 50px #086dff,inset 0 0 24px #4be9ff}.q:active{transform:translateX(-50%) scale(.9)}#flash{position:fixed;inset:0;background:#eaffff;opacity:0;pointer-events:none;z-index:15}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="tag">LIGHTNING Q<small>WEBGL CINEMATIC</small></div><div id="flash"></div><button class="q" id="q">Q</button><script type="module">import * as THREE from 'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x01030a);scene.fog=new THREE.FogExp2(0x071323,.035);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.set(0,4.6,12);camera.lookAt(0,2,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.8;document.body.prepend(renderer.domElement);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2.6,.7,.05);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x173a61,0x020204,.45));const floor=new THREE.Mesh(new THREE.CircleGeometry(18,96),new THREE.MeshStandardMaterial({color:0x07101a,roughness:.75,metalness:.25}));floor.rotation.x=-Math.PI/2;scene.add(floor);const impactLight=new THREE.PointLight(0x49dfff,0,18,1.4);impactLight.position.set(0,.35,0);scene.add(impactLight);const group=new THREE.Group();scene.add(group);function glowMat(c=0x74eaff,o=1){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function boltMesh(start,end,segments=22,jitter=.3,radius=.055){let pts=[start.clone()];for(let i=1;i<segments;i++){let t=i/segments,p=start.clone().lerp(end,t);p.x+=(Math.random()-.5)*jitter;p.z+=(Math.random()-.5)*jitter;p.y+=(Math.random()-.5)*jitter*.35;pts.push(p)}pts.push(end.clone());let curve=new THREE.CatmullRomCurve3(pts),core=new THREE.Mesh(new THREE.TubeGeometry(curve,segments*2,radius,6,false),glowMat(0xd9ffff,1)),halo=new THREE.Mesh(new THREE.TubeGeometry(curve,segments*2,radius*4,6,false),glowMat(0x168dff,.2));let q=new THREE.Group();q.add(halo,core);return q}function ring(r=.5){let m=new THREE.Mesh(new THREE.TorusGeometry(r,.055,10,80),glowMat(0x55eaff,.9));m.rotation.x=Math.PI/2;return m}let starsGeo=new THREE.BufferGeometry(),N=260,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*18;pos[i*3+1]=Math.random()*10;pos[i*3+2]=(Math.random()-.5)*12}starsGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x5dbfff,size:.025,transparent:true,opacity:.45,blending:THREE.AdditiveBlending})));let active=false,startTime=0,bolts=[],rings=[],debris=[];const flash=document.querySelector('#flash');function clearFX(){for(const o of [...bolts,...rings,...debris]){group.remove(o);o.traverse?.(n=>{n.geometry?.dispose();n.material?.dispose()})}bolts=[];rings=[];debris=[]}function cast(){if(active)return;clearFX();active=true;startTime=performance.now();let main=boltMesh(new THREE.Vector3(0,11,0),new THREE.Vector3(0,.08,0),34,.75,.11);group.add(main);bolts.push(main);for(let i=0;i<14;i++){let y=2+Math.random()*8,a=Math.random()*Math.PI*2,len=2+Math.random()*5,s=new THREE.Vector3(0,y,0),e=new THREE.Vector3(Math.cos(a)*len,y+(Math.random()-.5)*2,Math.sin(a)*len);let b=boltMesh(s,e,12,.55,.025+Math.random()*.025);group.add(b);bolts.push(b)}for(let i=0;i<20;i++){let a=i/20*Math.PI*2+Math.random()*.2,len=2+Math.random()*5,b=boltMesh(new THREE.Vector3(0,.07,0),new THREE.Vector3(Math.cos(a)*len,.05,Math.sin(a)*len),12,.25,.025);group.add(b);bolts.push(b)}for(let i=0;i<5;i++){let r=ring(.4);group.add(r);rings.push(r)}for(let i=0;i<65;i++){let geo=new THREE.TetrahedronGeometry(.04+Math.random()*.13),m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x18384b,emissive:0x0b3850,emissiveIntensity:.7,roughness:.7}));m.position.set(0,.1,0);m.userData.v=new THREE.Vector3((Math.random()-.5)*8,2+Math.random()*6,(Math.random()-.5)*8);group.add(m);debris.push(m)}flash.style.transition='none';flash.style.opacity='.95';setTimeout(()=>{flash.style.transition='opacity .28s';flash.style.opacity='0'},35)}function animate(now){requestAnimationFrame(animate);let time=now*.001;if(active){let ms=now-startTime,t=ms/1900,fade=Math.max(0,1-t);impactLight.intensity=80*Math.max(0,1-ms/1000)*(0.8+Math.random()*.4);bloom.strength=2.7+Math.max(0,1-ms/700)*2.2;for(let i=0;i<bolts.length;i++){bolts[i].visible=Math.random()>.08;bolts[i].scale.setScalar(.92+Math.random()*.16);bolts[i].traverse(n=>{if(n.material)n.material.opacity*=.995})}rings.forEach((r,i)=>{let s=.5+Math.min(1,ms/950)*(5+i*1.35);r.scale.setScalar(s);r.material.opacity=fade*(.8-i*.1)});let dt=Math.min(ms,1500)/1000;debris.forEach(d=>{d.position.copy(d.userData.v).multiplyScalar(dt);d.position.y+=.1-4.4*dt*dt;d.rotation.x+=.05;d.rotation.z+=.04});camera.position.x=(Math.random()-.5)*Math.max(0,1-ms/500)*.18;camera.position.y=4.6+(Math.random()-.5)*Math.max(0,1-ms/500)*.12;camera.lookAt(0,2,0);if(t>=1){active=false;impactLight.intensity=0;bloom.strength=2.2;camera.position.set(0,4.6,12);clearFX()}}else{impactLight.intensity=.2+Math.sin(time*2)*.15}composer.render()}requestAnimationFrame(animate);document.querySelector('#q').addEventListener('pointerdown',e=>{e.preventDefault();cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,1000)</script></body></html>
