<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Q 3D Orbit Preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#effcff;text-decoration:none;font-size:18px}.hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;color:#ccefff;background:#06111ccc;border:1px solid #23506b;border-radius:18px;padding:8px 13px;font-size:12px;white-space:nowrap;pointer-events:none}.q{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #8ef5ff;color:white;font-size:34px;background:radial-gradient(circle,#1788bc,#063452 65%,#02101b);box-shadow:0 0 24px #31ddff,0 0 55px #0875ff,inset 0 0 25px #50eaff}#flash{position:fixed;inset:0;z-index:15;background:#eaffff;opacity:0;pointer-events:none;transition:opacity .25s}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div class="hint">Geser = putar · Cubit = zoom · Tekan Q = VFX + SOUND</div><div id="flash"></div><button class="q" id="q">Q</button><script type="module">import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);scene.fog=new THREE.FogExp2(0x07111b,.026);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(8,5.2,13);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.4,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=5;controls.maxDistance=28;controls.maxPolarAngle=Math.PI*.48;controls.update();const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.65,.55,.12);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x284866,0x050404,.55));const moon=new THREE.DirectionalLight(0x6b8ca8,1.2);moon.position.set(-7,10,5);scene.add(moon);const mat=new THREE.MeshStandardMaterial({color:0x20272c,roughness:.93});const gg=new THREE.PlaneGeometry(50,50,55,55),pa=gg.attributes.position;for(let i=0;i<pa.count;i++){let X=pa.getX(i),Y=pa.getY(i);pa.setZ(i,(Math.sin(X*1.7)+Math.cos(Y*1.35)+Math.sin((X+Y)*2.1))*.1+Math.random()*.12)}gg.computeVertexNormals();const ground=new THREE.Mesh(gg,mat);ground.rotation.x=-Math.PI/2;scene.add(ground);const grid=new THREE.GridHelper(40,40,0x37c9ff,0x17435a);grid.position.y=.12;grid.material.transparent=true;grid.material.opacity=.42;scene.add(grid);const axes=new THREE.AxesHelper(2);axes.position.y=.14;scene.add(axes);function rock(x,z,s){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,1),mat);m.position.set(x,s*.4,z);m.scale.y=.7+Math.random()*1.8;m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);scene.add(m)}for(let i=0;i<60;i++){let a=Math.random()*6.28,r=3+Math.random()*18;rock(Math.cos(a)*r,Math.sin(a)*r,.2+Math.random()*1.2)}const impact=new THREE.PointLight(0x4adfff,0,25,1.5);impact.position.set(0,.5,0);scene.add(impact);const fx=new THREE.Group();scene.add(fx);function gm(c,o){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function bolt(s,e,n=24,j=.3,r=.045){let p=[s.clone()];for(let i=1;i<n;i++){let t=i/n,q=s.clone().lerp(e,t);q.x+=(Math.random()-.5)*j;q.z+=(Math.random()-.5)*j;q.y+=(Math.random()-.5)*j*.5;p.push(q)}p.push(e.clone());let c=new THREE.CatmullRomCurve3(p),G=new THREE.Group();G.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r*4,5),gm(0x147cff,.17)));G.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r,6),gm(0xd9ffff,1)));return G}let AC=null;async function unlockAudio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('AudioContext unsupported');AC=new C({latencyHint:'interactive'})}if(AC.state!=='running')await AC.resume();return AC}function playSound(){if(!AC||AC.state!=='running')return;const t=AC.currentTime,master=AC.createGain(),comp=AC.createDynamicsCompressor();master.gain.setValueAtTime(.95,t);master.connect(comp);comp.connect(AC.destination);const sr=AC.sampleRate,len=Math.floor(sr*1.7),buf=AC.createBuffer(1,len,sr),data=buf.getChannelData(0);for(let i=0;i<len;i++){let x=i/sr;data[i]=(Math.random()*2-1)*(Math.exp(-x*13)*.95+Math.exp(-x*2.4)*.32)}const noise=AC.createBufferSource(),filter=AC.createBiquadFilter(),ng=AC.createGain();noise.buffer=buf;filter.type='lowpass';filter.frequency.setValueAtTime(6500,t);filter.frequency.exponentialRampToValueAtTime(280,t+1.5);ng.gain.setValueAtTime(1.2,t);ng.gain.exponentialRampToValueAtTime(.001,t+1.65);noise.connect(filter).connect(ng).connect(master);noise.start(t);noise.stop(t+1.7);const boom=AC.createOscillator(),bg=AC.createGain();boom.type='sine';boom.frequency.setValueAtTime(95,t);boom.frequency.exponentialRampToValueAtTime(28,t+.9);bg.gain.setValueAtTime(1.15,t);bg.gain.exponentialRampToValueAtTime(.001,t+1.25);boom.connect(bg).connect(master);boom.start(t);boom.stop(t+1.3);const crack=AC.createOscillator(),cg=AC.createGain();crack.type='square';crack.frequency.setValueAtTime(2200,t);crack.frequency.exponentialRampToValueAtTime(130,t+.12);cg.gain.setValueAtTime(.28,t);cg.gain.exponentialRampToValueAtTime(.001,t+.15);crack.connect(cg).connect(master);crack.start(t);crack.stop(t+.16)}let active=false,st=0,bolts=[],rings=[],debris=[];function clean(){for(const o of [...bolts,...rings,...debris])fx.remove(o);bolts=[];rings=[];debris=[]}function cast(){if(active)return;clean();active=true;st=performance.now();let main=bolt(new THREE.Vector3(0,14,0),new THREE.Vector3(0,.1,0),40,.65,.1);fx.add(main);bolts.push(main);for(let i=0;i<32;i++){let a=Math.random()*6.28,L=2+Math.random()*6,y=i<17?1+Math.random()*11:.1,s=i<17?new THREE.Vector3(0,y,0):new THREE.Vector3(0,.1,0),e=i<17?new THREE.Vector3(Math.cos(a)*L,y+(Math.random()-.5)*2,Math.sin(a)*L):new THREE.Vector3(Math.cos(a)*L,.08,Math.sin(a)*L),b=bolt(s,e,12,.4,.025);fx.add(b);bolts.push(b)}for(let i=0;i<4;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(.6,.045,8,70),gm(0x68eaff,.8));r.rotation.x=Math.PI/2;r.position.y=.09;fx.add(r);rings.push(r)}for(let i=0;i<70;i++){let d=new THREE.Mesh(new THREE.TetrahedronGeometry(.05+Math.random()*.15),mat);d.userData.v=new THREE.Vector3((Math.random()-.5)*10,2+Math.random()*7,(Math.random()-.5)*10);fx.add(d);debris.push(d)}let F=document.querySelector('#flash');F.style.opacity='.9';setTimeout(()=>F.style.opacity='0',70)}function loop(now){requestAnimationFrame(loop);controls.update();if(active){let ms=now-st,t=ms/2300,f=Math.max(0,1-t);impact.intensity=70*Math.max(0,1-ms/1100);bolts.forEach(b=>b.visible=Math.random()>.06);rings.forEach((r,i)=>{r.scale.setScalar(.5+Math.min(1,ms/950)*(5+i*1.6));r.material.opacity=f});let dt=Math.min(ms,1500)/1000;debris.forEach(d=>{d.position.copy(d.userData.v).multiplyScalar(dt);d.position.y+=.15-4.5*dt*dt});bloom.strength=1.7+Math.max(0,1-ms/850)*2.6;if(t>=1){active=false;impact.intensity=0;clean()}}composer.render()}requestAnimationFrame(loop);const qb=document.querySelector('#q');qb.addEventListener('pointerdown',async e=>{e.preventDefault();e.stopPropagation();try{await unlockAudio();playSound()}catch(err){console.error(err)}cast()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(cast,900)</script></body></html>
