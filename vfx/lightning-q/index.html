<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lightning Q 3D + Sound</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a;touch-action:none;font-family:Arial}canvas{display:block}.back{position:fixed;left:18px;top:18px;z-index:20;color:#effcff;text-decoration:none;font-size:18px}.q{position:fixed;right:24px;bottom:26px;z-index:20;width:92px;height:92px;border-radius:50%;border:3px solid #8ef5ff;color:white;font-size:34px;background:radial-gradient(circle,#1788bc,#063452 65%,#02101b);box-shadow:0 0 24px #31ddff,0 0 55px #0875ff,inset 0 0 25px #50eaff}#flash{position:fixed;inset:0;z-index:15;background:#eaffff;opacity:0;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><a class="back" href="../../">← VFX</a><div id="flash"></div><button class="q" id="q">Q</button><script type="module">import * as THREE from'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);scene.fog=new THREE.FogExp2(0x07111b,.026);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(8,5.2,13);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.65,.55,.12);composer.addPass(bloom);scene.add(new THREE.HemisphereLight(0x284866,0x050404,.55));const moon=new THREE.DirectionalLight(0x6b8ca8,1.2);moon.position.set(-7,10,5);scene.add(moon);const mat=new THREE.MeshStandardMaterial({color:0x20272c,roughness:.93});const gg=new THREE.PlaneGeometry(50,50,55,55),pa=gg.attributes.position;for(let i=0;i<pa.count;i++){let X=pa.getX(i),Y=pa.getY(i);pa.setZ(i,(Math.sin(X*1.7)+Math.cos(Y*1.35)+Math.sin((X+Y)*2.1))*.1+Math.random()*.12)}gg.computeVertexNormals();const ground=new THREE.Mesh(gg,mat);ground.rotation.x=-Math.PI/2;scene.add(ground);function rock(x,z,s){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,1),mat);m.position.set(x,s*.4,z);m.scale.y=.7+Math.random()*1.8;m.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);scene.add(m)}for(let i=0;i<60;i++){let a=Math.random()*6.28,r=3+Math.random()*18;rock(Math.cos(a)*r,Math.sin(a)*r,.2+Math.random()*1.2)}const impact=new THREE.PointLight(0x4adfff,0,25,1.5);impact.position.set(0,.5,0);scene.add(impact);const fx=new THREE.Group();scene.add(fx);function gm(c,o){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false})}function bolt(s,e,n=24,j=.3,r=.045){let p=[s.clone()];for(let i=1;i<n;i++){let t=i/n,q=s.clone().lerp(e,t);q.x+=(Math.random()-.5)*j;q.z+=(Math.random()-.5)*j;q.y+=(Math.random()-.5)*j*.5;p.push(q)}p.push(e.clone());let c=new THREE.CatmullRomCurve3(p),G=new THREE.Group();G.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r*4,5),gm(0x147cff,.17)));G.add(new THREE.Mesh(new THREE.TubeGeometry(c,n*2,r,5),gm(0xd9ffff,1)));return G}let AC=null;function audio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime,master=AC.createGain();master.gain.setValueAtTime(.75,t);master.connect(AC.destination);let osc=AC.createOscillator(),og=AC.createGain();osc.type='sine';osc.frequency.setValueAtTime(75,t);osc.frequency.exponentialRampToValueAtTime(28,t+.75);og.gain.setValueAtTime(.8,t);og.gain.exponentialRampToValueAtTime(.001,t+1.25);osc.connect(og).connect(master);osc.start(t);osc.stop(t+1.3);let len=AC.sampleRate*1.8,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(AC.sampleRate*.38));let src=AC.createBufferSource();src.buffer=b;let bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=950;bp.Q.value=.65;let ng=AC.createGain();ng.gain.setValueAtTime(1,t);ng.gain.exponentialRampToValueAtTime(.001,t+1.6);src.connect(bp).connect(ng).connect(master);src.start(t);let crack=AC.createOscillator(),cg=AC.createGain();crack.type='sawtooth';crack.frequency.setValueAtTime(1800,t);crack.frequency.exponentialRampToValueAtTime(180,t+.09);cg.gain.setValueAtTime(.32,t);cg.gain.exponentialRampToValueAtTime(.001,t+.13);crack.connect(cg).connect(master);crack.start(t);crack.stop(t+.14);setTimeout(()=>{if(!AC)return;let tt=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(48,tt);o.frequency.exponentialRampToValueAtTime(24,tt+.8);g.gain.setValueAtTime(.45,tt);g.gain.exponentialRampToValueAtTime(.001,tt+1);o.connect(g).connect(master);o.start(tt);o.stop(tt+1)},130)}let active=false,st=0,bolts=[],rings=[],debris=[];function clean(){for(const o of [...bolts,...rings,...debris])fx.remove(o);bolts=[];rings=[];debris=[]}function cast(withSound=true){if(active)return;if(withSound)audio();clean();active=true;st=performance.now();let main=bolt(new THREE.Vector3(0,14,0),new THREE.Vector3(0,.1,0),40,.65,.1);fx.add(main);bolts.push(main);for(let i=0;i<30;i++){let a=Math.random()*6.28,L=2+Math.random()*6,y=i<16?1+Math.random()*11:.1,s=i<16?new THREE.Vector3(0,y,0):new THREE.Vector3(0,.1,0),e=i<16?new THREE.Vector3(Math.cos(a)*L,y+(Math.random()-.5)*2,Math.sin(a)*L):new THREE.Vector3(Math.cos(a)*L,.08,Math.sin(a)*L),b=bolt(s,e,12,.4,.025);fx.add(b);bolts.push(b)}for(let i=0;i<4;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(.6,.045,8,70),gm(0x68eaff,.8));r.rotation.x=Math.PI/2;r.position.y=.09;fx.add(r);rings.push(r)}for(let i=0;i<70;i++){let d=new THREE.Mesh(new THREE.TetrahedronGeometry(.05+Math.random()*.15),mat);d.userData.v=new THREE.Vector3((Math.random()-.5)*10,2+Math.random()*7,(Math.random()-.5)*10);fx.add(d);debris.push(d)}let F=document.querySelector('#flash');F.style.opacity='.9';setTimeout(()=>F.style.opacity='0',80)}function loop(now){requestAnimationFrame(loop);if(active){let ms=now-st,t=ms/2100,f=Math.max(0,1-t);impact.intensity=70*Math.max(0,1-ms/1100);bolts.forEach(b=>b.visible=Math.random()>.07);rings.forEach((r,i)=>{r.scale.setScalar(.5+Math.min(1,ms/900)*(5+i*1.6));r.material.opacity=f});let dt=Math.min(ms,1500)/1000;debris.forEach(d=>{d.position.copy(d.userData.v).multiplyScalar(dt);d.position.y+=.15-4.5*dt*dt;d.rotation.x+=.06});let sh=Math.max(0,1-ms/650);camera.position.set(8+(Math.random()-.5)*.25*sh,5.2+(Math.random()-.5)*.16*sh,13);camera.lookAt(0,1.5,0);bloom.strength=1.7+Math.max(0,1-ms/850)*2.6;if(t>=1){active=false;impact.intensity=0;clean()}}else camera.lookAt(0,1.3,0);composer.render()}requestAnimationFrame(loop);document.querySelector('#q').addEventListener('pointerdown',e=>{e.preventDefault();cast(true)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(()=>cast(false),900)</script></body></html>
