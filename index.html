<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Ngizing - Q Lightning VFX Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a;font-family:Arial,sans-serif;touch-action:none}#game{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 45%,#19384b 0,#0b1d29 45%,#050b12 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.arena{position:absolute;left:5%;top:8%;width:90%;height:78%;border:2px solid #355b6c;border-radius:50%;box-shadow:inset 0 0 80px #112d3b;background:repeating-radial-gradient(circle at center,transparent 0 65px,rgba(90,170,190,.08) 66px 68px)}.unit{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:bold;color:white;z-index:3}.player{left:30%;top:58%;background:radial-gradient(circle at 40% 35%,#aef6ff,#177fb2 45%,#06334f 75%);box-shadow:0 0 28px #2bdcff}.enemy{left:70%;top:38%;background:radial-gradient(circle at 40% 35%,#ffc0c0,#b72e3d 45%,#4b0a16 75%);box-shadow:0 0 25px #ff4359}.label{position:absolute;top:70px;white-space:nowrap;font-size:12px;text-shadow:0 2px 4px #000}.hp{position:absolute;top:-12px;width:70px;height:6px;background:#251116;border-radius:4px;overflow:hidden}.hp:after{content:'';display:block;width:100%;height:100%;background:#53e76b}.title{position:absolute;top:18px;left:0;right:0;text-align:center;color:#dffaff;font-weight:700;letter-spacing:.08em;text-shadow:0 0 12px #34d9ff;z-index:5}.hint{position:absolute;top:48px;left:0;right:0;text-align:center;color:#91adba;font-size:12px;z-index:5}.q{position:absolute;right:25px;bottom:32px;width:84px;height:84px;border-radius:50%;border:3px solid #70edff;background:radial-gradient(circle,#2e9bc8 0,#0d496b 55%,#061b2b 100%);color:white;font-size:30px;font-weight:bold;box-shadow:0 0 20px #25d8ff,inset 0 0 18px #4edfff;z-index:10}.q:active{transform:scale(.92)}.q.cool{filter:grayscale(.75);opacity:.6}.cd{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#fff}.status{position:absolute;left:20px;bottom:28px;color:#a8c6d3;font-size:13px;z-index:5}</style>
</head>
<body><div id="game"><div class="arena"></div><div class="title">THE LEGEND OF NGIZING</div><div class="hint">Web VFX Test • tekan tombol Q</div><div id="player" class="unit player"><div class="hp"></div>YOU<div class="label">Vantra</div></div><div id="enemy" class="unit enemy"><div class="hp"></div>BOT<div class="label">Target</div></div><canvas id="fx"></canvas><button id="q" class="q">Q<span id="cd" class="cd"></span></button><div class="status">Q • Lightning Strike</div></div>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),q=document.getElementById('q'),cd=document.getElementById('cd'),player=document.getElementById('player'),enemy=document.getElementById('enemy');let active=false,cool=false;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function bolt(a,b,jag=34,segments=14){const p=[a];for(let i=1;i<segments;i++){const t=i/segments;const x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;const nx=-dy/len,ny=dx/len;const off=(Math.random()-.5)*jag*(Math.sin(Math.PI*t));p.push({x:x+nx*off,y:y+ny*off})}p.push(b);return p}
function path(points,w,blur,alpha){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(115,225,255,${alpha})`;ctx.lineWidth=w;ctx.shadowColor='#2fdcff';ctx.shadowBlur=blur;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${Math.min(1,alpha+.15)})`;ctx.lineWidth=Math.max(1,w*.2);ctx.shadowBlur=4;ctx.stroke();ctx.restore()}
function ring(p,r,a){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(74,225,255,${a})`;ctx.lineWidth=4;ctx.shadowColor='#38e7ff';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.35,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function cast(){if(cool)return;cool=true;q.classList.add('cool');let left=2;cd.textContent=left;const timer=setInterval(()=>{left--;cd.textContent=left>0?left:'';if(left<=0){clearInterval(timer);cool=false;q.classList.remove('cool')}},1000);const start=performance.now();active=true;function frame(now){const t=(now-start)/560;ctx.clearRect(0,0,innerWidth,innerHeight);if(t>=1){active=false;return}const a=center(player),b=center(enemy);const fade=1-t;const flick=.55+Math.random()*.45;path(bolt(a,b,46,17),10,30,fade*.34*flick);path(bolt(a,b,28,17),4,14,fade*.95*flick);const sky={x:b.x+(Math.random()-.5)*35,y:-30};path(bolt(sky,b,60,20),13,38,fade*.25);path(bolt(sky,b,34,20),4,16,fade*.9);const flash=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,85*(1+t));flash.addColorStop(0,`rgba(230,252,255,${fade*.8})`);flash.addColorStop(.2,`rgba(65,220,255,${fade*.45})`);flash.addColorStop(1,'rgba(0,100,255,0)');ctx.fillStyle=flash;ctx.fillRect(b.x-130,b.y-130,260,260);ring(b,25+t*110,fade*.75);for(let i=0;i<7;i++){const ang=i*Math.PI*2/7+Math.random()*.3,end={x:b.x+Math.cos(ang)*(45+t*90),y:b.y+Math.sin(ang)*(20+t*42)};path(bolt(b,end,18,6),2.5,10,fade*.7)}requestAnimationFrame(frame)}requestAnimationFrame(frame)}
q.addEventListener('pointerdown',e=>{e.preventDefault();cast()});setTimeout(cast,700);
</script></body></html>
